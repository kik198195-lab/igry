<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сокровища Аладдина — Математика</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden;user-select:none;}

/* ===== ARABIAN NIGHT SKY ===== */
.sky{position:fixed;inset:0;z-index:0;
  background:linear-gradient(180deg,#0a0015 0%,#1a0533 30%,#2d1410 60%,#8B4513 80%,#DAA520 100%);}

/* Stars */
.sky::before{content:'';position:absolute;inset:0;
  background-image:radial-gradient(circle,#fff 1px,transparent 1px),radial-gradient(circle,rgba(255,255,255,0.7) 1px,transparent 1px),radial-gradient(circle,rgba(255,215,0,0.5) 1px,transparent 1px);
  background-size:80px 80px,55px 55px,110px 110px;
  background-position:10px 10px,35px 25px,60px 5px;
  animation:starTwinkle 3s ease-in-out infinite alternate;opacity:0.8;}
@keyframes starTwinkle{from{opacity:0.5;}to{opacity:1;}}

/* Moon */
.moon{position:fixed;top:12px;right:18px;font-size:50px;z-index:1;
  animation:moonGlow 4s ease-in-out infinite;filter:drop-shadow(0 0 12px #FFD700);}
@keyframes moonGlow{0%,100%{filter:drop-shadow(0 0 12px #FFD700);}50%{filter:drop-shadow(0 0 28px #FFD700);}}

/* Desert dunes */
.dunes{position:fixed;bottom:0;left:0;right:0;height:120px;z-index:0;
  background:radial-gradient(ellipse 60% 100% at 20% 100%,#c8860a 0%,transparent 70%),
             radial-gradient(ellipse 50% 90% at 60% 100%,#DAA520 0%,transparent 65%),
             radial-gradient(ellipse 70% 80% at 85% 100%,#b8750a 0%,transparent 75%);
  opacity:0.7;}

/* Flying carpet trail */
.carpet-trail{position:fixed;pointer-events:none;z-index:0;}

/* Gold sparkles */
.sparkle{position:fixed;pointer-events:none;z-index:0;font-size:14px;
  animation:sparkleDrift linear infinite;opacity:0.4;}
@keyframes sparkleDrift{0%{transform:translateY(0) rotate(0deg);opacity:0.4;}50%{opacity:0.7;}100%{transform:translateY(-60vh) rotate(360deg);opacity:0;}}

.screen{display:none;position:relative;z-index:2;}
.screen.active{display:flex;flex-direction:column;align-items:center;min-height:100vh;}

/* ===== MENU ===== */
#menu{padding:14px 14px 30px;text-align:center;}

.menu-logo{font-size:64px;display:block;margin-top:6px;
  animation:lampGlow 2s ease-in-out infinite;}
@keyframes lampGlow{0%,100%{filter:drop-shadow(0 0 8px #FFD700);}50%{filter:drop-shadow(0 0 24px #FFD700) drop-shadow(0 0 40px rgba(255,215,0,0.5));}}

.menu-title{font-size:32px;font-weight:900;
  background:linear-gradient(135deg,#FFD700,#FFA500,#FF6B00);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:none;margin:8px 0 3px;line-height:1.2;}
.menu-sub{font-size:13px;color:#FFD700;background:rgba(0,0,0,0.35);padding:5px 16px;border-radius:50px;
  margin:0 0 18px;font-weight:700;display:inline-block;border:1px solid rgba(255,215,0,0.3);}

/* Category grid */
.cat-label{font-size:14px;font-weight:800;color:#FFD700;margin-bottom:10px;
  text-shadow:0 0 10px rgba(255,215,0,0.5);}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:380px;margin-bottom:16px;}
.cat-btn{padding:12px 8px;border-radius:16px;border:2px solid rgba(255,215,0,0.35);
  cursor:pointer;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  color:#fff;text-align:center;transition:all 0.15s;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  box-shadow:0 4px 0 rgba(0,0,0,0.3);}
.cat-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.3);}
.cat-btn .ci{font-size:22px;}
.cat-btn .cn{font-size:12px;line-height:1.3;}
.cat-btn.selected{border-color:#FFD700;box-shadow:0 4px 0 rgba(255,165,0,0.5),0 0 15px rgba(255,215,0,0.3);}

.c-add10{background:linear-gradient(135deg,#1565C0,#0D47A1);}
.c-sub10{background:linear-gradient(135deg,#AD1457,#880E4F);}
.c-add20{background:linear-gradient(135deg,#2E7D32,#1B5E20);}
.c-sub20{background:linear-gradient(135deg,#6A1B9A,#4A148C);}
.c-addC{background:linear-gradient(135deg,#E65100,#BF360C);}
.c-subC{background:linear-gradient(135deg,#006064,#004D40);}
.c-add100{background:linear-gradient(135deg,#37474F,#263238);}
.c-sub100{background:linear-gradient(135deg,#4E342E,#3E2723);}

.mode-wrap{display:flex;flex-direction:column;gap:11px;width:100%;max-width:380px;}
.mode-btn{padding:18px 20px;border-radius:20px;border:2px solid rgba(255,215,0,0.4);
  cursor:pointer;font-family:'Nunito',sans-serif;color:#fff;
  display:flex;align-items:center;gap:12px;transition:all 0.15s;
  box-shadow:0 5px 0 rgba(0,0,0,0.3);}
.mode-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.3);}
.mb-icon{font-size:34px;flex-shrink:0;}
.mb-txt{display:flex;flex-direction:column;text-align:left;}
.mb-name{font-size:17px;font-weight:900;}
.mb-desc{font-size:11px;font-weight:600;opacity:0.85;margin-top:2px;}
.btn-solo{background:linear-gradient(135deg,#8B4513,#5D2E0C);}
.btn-duo{background:linear-gradient(135deg,#1a237e,#0d1454);}
.author-tag{margin-top:20px;color:rgba(255,215,0,0.25);font-size:11px;letter-spacing:2px;font-weight:700;}

/* ===== HEADER ===== */
.game-hdr{background:rgba(0,0,0,0.4);padding:9px 13px;display:flex;align-items:center;
  justify-content:space-between;width:100%;backdrop-filter:blur(6px);
  border-bottom:1px solid rgba(255,215,0,0.2);}
.back-btn{background:rgba(255,215,0,0.15);border:2px solid rgba(255,215,0,0.4);
  color:#FFD700;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;
  padding:7px 14px;border-radius:50px;cursor:pointer;}
.back-btn:active{transform:translateY(2px);}
.hdr-info{color:#FFD700;font-size:13px;font-weight:800;text-shadow:0 0 10px rgba(255,215,0,0.4);}

/* ===== TREASURE TRACK ===== */
.treasure-track{width:100%;padding:9px 11px 4px;}
.track-lbl{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.t-name{font-size:13px;font-weight:900;color:#FFD700;text-shadow:0 0 8px rgba(255,215,0,0.4);}
.t-gold{display:flex;align-items:center;gap:4px;background:rgba(255,215,0,0.15);
  border:1px solid rgba(255,215,0,0.35);border-radius:50px;padding:2px 10px;
  color:#FFD700;font-size:13px;font-weight:800;}

.track-road{height:52px;background:rgba(0,0,0,0.3);border-radius:14px;
  border:2px solid rgba(255,215,0,0.25);position:relative;overflow:hidden;}
/* Sand texture */
.track-road::before{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(90deg,rgba(218,165,32,0.05) 0,rgba(218,165,32,0.05) 20px,transparent 20px,transparent 40px);}
/* Chest at finish */
.track-finish{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:24px;z-index:2;}
/* Hero on track */
.track-hero{position:absolute;top:50%;transform:translateY(-55%) scaleX(-1);
  font-size:28px;transition:left 0.6s cubic-bezier(0.34,1.4,0.64,1);z-index:3;
  filter:drop-shadow(2px 2px 4px rgba(0,0,0,0.5));}
/* Gold trail */
.gold-trail{position:absolute;top:0;bottom:0;left:0;
  background:linear-gradient(90deg,rgba(255,215,0,0.15),transparent);
  transition:width 0.6s ease;z-index:1;}
.track-bar-wrap{height:5px;background:rgba(255,255,255,0.08);border-radius:3px;margin-top:4px;overflow:hidden;}
.track-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,#FFD700,#FF8C00);transition:width 0.5s ease;}

/* Gold coins popup */
.gold-popup{position:fixed;font-size:22px;pointer-events:none;z-index:500;
  animation:goldPop 0.8s ease forwards;}
@keyframes goldPop{0%{transform:translateY(0) scale(0.5);opacity:1;}100%{transform:translateY(-80px) scale(1.2);opacity:0;}}

/* ===== SCROLL QUESTION ===== */
.q-scroll{margin:8px 11px 6px;
  background:linear-gradient(135deg,rgba(255,248,220,0.96),rgba(255,235,160,0.93));
  border:3px solid rgba(255,215,0,0.6);border-radius:20px;padding:16px 14px;
  text-align:center;box-shadow:0 6px 24px rgba(0,0,0,0.4),0 0 20px rgba(255,215,0,0.1);
  position:relative;overflow:hidden;}
.q-scroll::before,.q-scroll::after{content:'🌙';position:absolute;top:8px;font-size:16px;opacity:0.3;}
.q-scroll::before{left:10px;}.q-scroll::after{right:10px;}
.q-cat{font-size:10px;font-weight:800;color:#8B4513;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px;}
.q-expr{font-size:48px;font-weight:900;color:#3E2723;animation:qPop 0.35s ease;}
@keyframes qPop{0%{transform:scale(0.5);opacity:0;}70%{transform:scale(1.1);}100%{transform:scale(1);opacity:1;}}
.q-hint{font-size:12px;color:#8B4513;margin-top:5px;font-weight:700;font-style:italic;}

/* ===== ANSWER GEMS ===== */
.gems-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 11px;width:100%;max-width:460px;}
.gem-btn{padding:16px 8px;border-radius:18px;border:3px solid rgba(255,215,0,0.3);
  font-family:'Nunito',sans-serif;font-size:24px;font-weight:900;
  cursor:pointer;color:#fff;text-align:center;transition:all 0.13s;
  box-shadow:0 5px 0 rgba(0,0,0,0.3);position:relative;overflow:hidden;}
.gem-btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,0.3);}
.gem-btn::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,0.1);opacity:0;transition:opacity 0.2s;}
.gem-btn:hover::before{opacity:1;}
.g0{background:linear-gradient(135deg,#C62828,#8B0000);box-shadow:0 5px 0 #560000;}
.g1{background:linear-gradient(135deg,#1565C0,#0D47A1);box-shadow:0 5px 0 #0A237E;}
.g2{background:linear-gradient(135deg,#2E7D32,#1B5E20);box-shadow:0 5px 0 #003300;}
.g3{background:linear-gradient(135deg,#6A1B9A,#4A148C);box-shadow:0 5px 0 #1a004a;}
.gem-btn.correct-flash{animation:gemCorrect 0.45s ease;
  background:linear-gradient(135deg,#FFD700,#FF8C00)!important;
  box-shadow:0 5px 0 #B8460B!important;color:#3E2723!important;}
.gem-btn.wrong-flash{animation:gemWrong 0.4s ease;}
@keyframes gemCorrect{0%{transform:scale(1);}30%{transform:scale(1.1);}100%{transform:scale(1);}}
@keyframes gemWrong{0%,100%{transform:translateX(0);}25%{transform:translateX(-9px);}75%{transform:translateX(9px);}}

/* ===== DUO SCREEN ===== */
#duoScreen{padding:0 0 14px;width:100%;}
.duo-tracks{width:100%;padding:7px 10px 4px;display:flex;flex-direction:column;gap:7px;}
.duo-strip{margin:4px 11px;background:rgba(0,0,0,0.3);border-radius:14px;padding:7px 16px;
  display:flex;align-items:center;justify-content:space-between;color:#FFD700;font-size:14px;font-weight:900;
  border:1px solid rgba(255,215,0,0.2);}
.vs-badge{background:#FFD700;color:#3E2723;border-radius:50px;padding:2px 14px;font-size:13px;font-weight:900;}

.duo-panels{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:5px 10px 0;}
.duo-panel{border-radius:17px;padding:8px 7px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.dp1{background:rgba(139,69,19,0.2);border:2px solid rgba(139,69,19,0.5);}
.dp2{background:rgba(26,35,126,0.2);border:2px solid rgba(26,35,126,0.5);}
.dp-hdr{width:100%;text-align:center;border-radius:10px;padding:5px 4px;font-size:13px;font-weight:900;color:#fff;}
.dp1 .dp-hdr{background:#8B4513;}
.dp2 .dp-hdr{background:#1a237e;}

/* Mini scroll for duo */
.mini-scroll{background:linear-gradient(135deg,rgba(255,248,220,0.94),rgba(255,235,160,0.9));
  border:2px solid rgba(255,215,0,0.55);border-radius:14px;padding:9px 6px;text-align:center;
  width:100%;box-shadow:0 3px 12px rgba(0,0,0,0.3);}
.ms-cat{font-size:8px;font-weight:800;color:#8B4513;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px;}
.ms-expr{font-size:24px;font-weight:900;color:#3E2723;line-height:1.2;}

/* Duo gems */
.duo-gems{display:grid;grid-template-columns:1fr 1fr;gap:5px;width:100%;}
.duo-gem{padding:10px 4px;border-radius:12px;border:2px solid rgba(255,215,0,0.25);
  font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;
  cursor:pointer;color:#fff;text-align:center;
  box-shadow:0 3px 0 rgba(0,0,0,0.3);transition:all 0.12s;}
.duo-gem:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0.3);}
.d1g0{background:linear-gradient(135deg,#C62828,#8B0000);box-shadow:0 3px 0 #560000;}
.d1g1{background:linear-gradient(135deg,#E65100,#BF360C);box-shadow:0 3px 0 #7f1900;}
.d1g2{background:linear-gradient(135deg,#AD1457,#880E4F);box-shadow:0 3px 0 #560027;}
.d1g3{background:linear-gradient(135deg,#F9A825,#F57F17);box-shadow:0 3px 0 #B8460B;}
.d2g0{background:linear-gradient(135deg,#1565C0,#0D47A1);box-shadow:0 3px 0 #0A237E;}
.d2g1{background:linear-gradient(135deg,#6A1B9A,#4A148C);box-shadow:0 3px 0 #1a004a;}
.d2g2{background:linear-gradient(135deg,#00695C,#004D40);box-shadow:0 3px 0 #001a15;}
.d2g3{background:linear-gradient(135deg,#283593,#1A237E);box-shadow:0 3px 0 #0d0f3e;}
.duo-gem.correct-flash{animation:gemCorrect 0.4s ease;background:linear-gradient(135deg,#FFD700,#FF8C00)!important;box-shadow:0 3px 0 #B8460B!important;color:#3E2723!important;}
.duo-gem.wrong-flash{animation:gemWrong 0.35s ease;}

/* ===== RESULTS ===== */
#results{justify-content:center;align-items:center;text-align:center;padding:30px 14px;}
.result-card{background:linear-gradient(135deg,rgba(255,248,220,0.97),rgba(255,235,160,0.94));
  border-radius:28px;padding:30px 22px;max-width:360px;width:100%;
  box-shadow:0 12px 50px rgba(0,0,0,0.5),0 0 30px rgba(255,215,0,0.2);
  border:3px solid rgba(255,215,0,0.6);}
.result-emoji{font-size:72px;margin-bottom:10px;display:block;animation:resultBounce 0.5s ease;}
@keyframes resultBounce{0%{transform:scale(0) rotate(-20deg);}70%{transform:scale(1.15) rotate(5deg);}100%{transform:scale(1) rotate(0);}}
.result-title{font-size:28px;font-weight:900;color:#3E2723;margin-bottom:5px;}
.result-gold{font-size:22px;margin:8px 0;font-weight:900;color:#8B4513;}
.result-msg{font-size:15px;color:#6D4C41;margin-bottom:4px;font-weight:700;}
.result-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
.res-btn{padding:13px 24px;border-radius:50px;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.2);}
.res-btn:active{transform:translateY(3px);}
.res-btn.primary{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#3E2723;}
.res-btn.secondary{background:rgba(139,69,19,0.15);color:#3E2723;border:2px solid rgba(255,215,0,0.4);}

/* TOAST */
.toast{position:fixed;top:13px;left:50%;transform:translateX(-50%) translateY(-100px);
  padding:10px 22px;border-radius:50px;font-size:15px;font-weight:800;
  transition:transform 0.28s cubic-bezier(0.34,1.56,0.64,1);z-index:999;
  white-space:nowrap;box-shadow:0 6px 24px rgba(0,0,0,0.4);}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.correct-t{background:linear-gradient(135deg,#FFD700,#FF8C00);color:#3E2723;}
.toast.wrong-t{background:linear-gradient(135deg,#C62828,#FF5252);color:#fff;}
.toast.info-t{background:rgba(255,248,220,0.96);color:#3E2723;border:2px solid rgba(255,215,0,0.5);}

/* CONFETTI gold */
.confetti-piece{position:fixed;border-radius:3px;animation:confettiFall linear forwards;pointer-events:none;z-index:9999;}
@keyframes confettiFall{0%{transform:translateY(-30px) rotate(0deg);opacity:1;}100%{transform:translateY(110vh) rotate(540deg);opacity:0;}}

/* Winner overlay */
.winner-overlay{display:none;position:fixed;inset:0;z-index:500;background:rgba(0,0,0,0.6);align-items:center;justify-content:center;}
.winner-overlay.show{display:flex;}
.winner-box{background:linear-gradient(135deg,rgba(255,248,220,0.98),rgba(255,235,160,0.95));
  border-radius:28px;padding:34px 26px;text-align:center;max-width:300px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 30px rgba(255,215,0,0.3);
  border:3px solid rgba(255,215,0,0.6);animation:resultBounce 0.5s ease;}
.w-emoji{font-size:58px;display:block;margin-bottom:10px;}
.w-title{font-size:24px;font-weight:900;color:#3E2723;margin-bottom:6px;}
.w-sub{font-size:15px;color:#6D4C41;margin-bottom:20px;font-weight:700;}
.w-btns{display:flex;gap:10px;justify-content:center;}

/* Music */
.music-btn{position:fixed;bottom:13px;right:13px;z-index:99;width:44px;height:44px;
  border-radius:50%;background:rgba(255,215,0,0.15);border:2px solid rgba(255,215,0,0.4);
  font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 0 rgba(0,0,0,0.2);}
</style>
</head>
<body>

<div class="sky"></div>
<div class="moon">🌙</div>
<div class="dunes"></div>
<div class="toast" id="toast"></div>
<div id="confettiBox" style="position:fixed;inset:0;pointer-events:none;z-index:9999;"></div>
<button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>

<!-- Winner -->
<div class="winner-overlay" id="winnerOverlay">
  <div class="winner-box">
    <span class="w-emoji" id="wEmoji"></span>
    <div class="w-title" id="wTitle"></div>
    <div class="w-sub" id="wSub"></div>
    <div class="w-btns">
      <button class="res-btn primary" onclick="closeWinner();playAgain()">Ещё раз!</button>
      <button class="res-btn secondary" onclick="closeWinner();goMenu()">Меню</button>
    </div>
  </div>
</div>

<!-- ===== MENU ===== -->
<div class="screen active" id="menu">
  <span class="menu-logo">🪔</span>
  <div class="menu-title">Сокровища Аладдина</div>
  <div class="menu-sub">Сложение и вычитание ✨</div>

  <div class="cat-label">Выбери задание:</div>
  <div class="cat-grid">
    <button class="cat-btn c-add10 selected" onclick="selectCat('add10',this)">
      <span class="ci">➕</span><span class="cn">Сложение<br>в пределах 10</span>
    </button>
    <button class="cat-btn c-sub10" onclick="selectCat('sub10',this)">
      <span class="ci">➖</span><span class="cn">Вычитание<br>в пределах 10</span>
    </button>
    <button class="cat-btn c-add20" onclick="selectCat('add20',this)">
      <span class="ci">➕</span><span class="cn">Сложение<br>в пределах 20<br><small>(без перехода)</small></span>
    </button>
    <button class="cat-btn c-sub20" onclick="selectCat('sub20',this)">
      <span class="ci">➖</span><span class="cn">Вычитание<br>в пределах 20<br><small>(без перехода)</small></span>
    </button>
    <button class="cat-btn c-addC" onclick="selectCat('addC',this)">
      <span class="ci">➕</span><span class="cn">Сложение<br>с переходом<br>через десяток</span>
    </button>
    <button class="cat-btn c-subC" onclick="selectCat('subC',this)">
      <span class="ci">➖</span><span class="cn">Вычитание<br>с переходом<br>через десяток</span>
    </button>
    <button class="cat-btn c-add100" onclick="selectCat('add100',this)">
      <span class="ci">➕</span><span class="cn">Сложение<br>в пределах 100</span>
    </button>
    <button class="cat-btn c-sub100" onclick="selectCat('sub100',this)">
      <span class="ci">➖</span><span class="cn">Вычитание<br>в пределах 100</span>
    </button>
  </div>

  <div class="mode-wrap">
    <button class="mode-btn btn-solo" onclick="startSolo()">
      <span class="mb-icon">🧞</span>
      <span class="mb-txt">
        <span class="mb-name">Аладдин — один игрок</span>
        <span class="mb-desc">10 примеров — собери золото в сундук!</span>
      </span>
    </button>

<script>
// ===== TOUCH PROTECTION =====
document.addEventListener('touchstart',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
var _lt=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-_lt<320)e.preventDefault();_lt=n;},{passive:false});

// ===== DECORATIONS =====
(function(){
  const sp=['✨','⭐','💫','🌟','💎'];
  for(let i=0;i<16;i++){
    const s=document.createElement('div');s.className='sparkle';
    s.textContent=sp[~~(Math.random()*sp.length)];
    s.style.cssText=`left:${Math.random()*100}vw;top:${Math.random()*80}vh;animation-duration:${5+Math.random()*10}s;animation-delay:-${Math.random()*10}s;font-size:${10+Math.random()*12}px;`;
    document.body.appendChild(s);
  }
})();

// ===== ARABIAN MUSIC ENGINE =====
let audioCtx=null,musicOn=true,bgTimer=null,bgPhase=0;

// Arabian-inspired scale (Hijaz maqam): D Eb F# G A Bb C# D
// In Hz (around D4=293Hz)
const arabianNotes=[
  293,311,370,392,440,466,554,587, // D4 Eb4 F#4 G4 A4 Bb4 C#5 D5
  587,554,466,440,392,370,311,293, // descending
  392,440,392,311,293,293,          // ornament
  370,392,440,554,587,554,440,392, // phrase 2
  311,370,311,293,                  // cadence
];
const arabianDur=[
  0.3,0.15,0.3,0.3,0.3,0.15,0.3,0.6,
  0.3,0.15,0.3,0.3,0.3,0.15,0.3,0.6,
  0.2,0.2,0.2,0.2,0.4,0.8,
  0.25,0.25,0.25,0.5,0.5,0.25,0.25,0.5,
  0.25,0.25,0.25,0.8,
];

function getCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}

function tone(f,d,type='sine',vol=0.12,delay=0){
  try{
    const c=getCtx();
    const o=c.createOscillator();
    const g=c.createGain();
    // Add slight reverb feel with second oscillator
    const o2=c.createOscillator();
    const g2=c.createGain();
    o.connect(g);g.connect(c.destination);
    o2.connect(g2);g2.connect(c.destination);
    o.type=type;o.frequency.value=f;
    o2.type='sine';o2.frequency.value=f*2; // octave up soft
    const t=c.currentTime+delay;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+d);
    g2.gain.setValueAtTime(0,t);
    g2.gain.linearRampToValueAtTime(vol*0.2,t+0.02);
    g2.gain.exponentialRampToValueAtTime(0.001,t+d*0.7);
    o.start(t);o.stop(t+d+0.05);
    o2.start(t);o2.stop(t+d*0.7+0.05);
  }catch(e){}
}

function playCorrect(){
  tone(554,.08,'sine',.25);
  setTimeout(()=>tone(659,.08,'sine',.25),70);
  setTimeout(()=>tone(784,.08,'sine',.25),140);
  setTimeout(()=>tone(1047,.25,'sine',.3),210);
  // Gold shimmer
  setTimeout(()=>tone(1319,.1,'sine',.15),300);
  setTimeout(()=>tone(1568,.15,'sine',.15),380);
}
function playWrong(){tone(220,.08,'sawtooth',.18);setTimeout(()=>tone(196,.22,'sawtooth',.14),80);}
function playClick(){tone(440,.07,'sine',.1);}
function playWin(){
  [392,440,494,554,587,659,784,880,1047].forEach((f,i)=>
    setTimeout(()=>tone(f,.18,'sine',.25),i*70));
}

// Background Arabian melody
let melIdx=0;
function bgNote(){
  if(!musicOn)return;
  const f=arabianNotes[melIdx%arabianNotes.length];
  const d=arabianDur[melIdx%arabianDur.length];
  tone(f,d,'triangle',.055);
  // Add percussion feel every 4 beats
  if(melIdx%4===0){
    try{
      const c=getCtx(),o=c.createOscillator(),g=c.createGain();
      o.connect(g);g.connect(c.destination);
      o.type='sine';o.frequency.value=80;
      g.gain.setValueAtTime(.08,c.currentTime);
      g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);
      o.start();o.stop(c.currentTime+.15);
    }catch(e){}
  }
  melIdx++;
  bgTimer=setTimeout(bgNote,(d*900));
}
function startBg(){stopBg();if(musicOn)bgNote();}
function stopBg(){if(bgTimer)clearTimeout(bgTimer);}
function toggleMusic(){musicOn=!musicOn;document.getElementById('musicBtn').textContent=musicOn?'🎵':'🔇';if(musicOn)startBg();else stopBg();}

// Gold confetti
const GC=['#FFD700','#FFA500','#FF8C00','#FFEC00','#FFD700','#fff'];
function confetti(){
  const b=document.getElementById('confettiBox');
  for(let i=0;i<100;i++)setTimeout(()=>{
    const p=document.createElement('div');p.className='confetti-piece';
    p.style.cssText=`left:${Math.random()*100}vw;background:${GC[~~(Math.random()*GC.length)]};width:${6+Math.random()*10}px;height:${6+Math.random()*10}px;border-radius:${Math.random()>.3?'50%':'3px'};animation-duration:${1.8+Math.random()*2}s;animation-delay:${Math.random()*.6}s;`;
    b.appendChild(p);setTimeout(()=>p.remove(),4200);
  },i*18);
}

// Gold popup
function goldPopup(el){
  const rect=el.getBoundingClientRect();
  const p=document.createElement('div');p.className='gold-popup';
  p.textContent='🪙+1';p.style.cssText=`left:${rect.left+rect.width/2-20}px;top:${rect.top}px;`;
  document.body.appendChild(p);setTimeout(()=>p.remove(),900);
}

// Toast
let toastT=null;
function toast(msg,type){const t=document.getElementById('toast');if(toastT)clearTimeout(toastT);t.textContent=msg;t.className=`toast show ${type}-t`;toastT=setTimeout(()=>t.classList.remove('show'),1500);}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function goMenu(){stopBg();playClick();showScreen('menu');startBg();}

// ===== CATEGORY CONFIG =====
const catInfo={
  add10:{label:'Сложение в пределах 10',hint:'Считай пальцами 🖐️'},
  sub10:{label:'Вычитание в пределах 10',hint:'Убери лишнее 🖐️'},
  add20:{label:'Сложение в пред. 20 (без перехода)',hint:'Десятки не меняются!'},
  sub20:{label:'Вычитание в пред. 20 (без перехода)',hint:'Единицы вычитай!'},
  addC:{label:'Сложение с переходом через десяток',hint:'Сначала дополни до 10!'},
  subC:{label:'Вычитание с переходом через десяток',hint:'Вычти через десяток!'},
  add100:{label:'Сложение в пределах 100',hint:'Складывай!'},
  sub100:{label:'Вычитание в пределах 100',hint:'Вычитай!'},
};

let selectedCat='add10', currentMode='solo';

function selectCat(cat,el){
  playClick();selectedCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  el.classList.add('selected');
}

// ===== QUESTION GENERATOR =====
function rnd(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function genQ(cat){
  let a,b,ans,expr;
  switch(cat){
    case 'add10':
      a=rnd(1,9);b=rnd(1,10-a);ans=a+b;expr=`${a} + ${b}`;break;
    case 'sub10':
      ans=rnd(0,9);b=rnd(1,10-ans);a=ans+b;expr=`${a} − ${b}`;break;
    case 'add20': // no carry: units sum < 10
      {const tens=rnd(1,1);const ua=rnd(1,9);const ub=rnd(1,9-ua);
      a=tens*10+ua;b=ub;ans=a+b;expr=`${a} + ${b}`;break;}
    case 'sub20': // no carry: units don't borrow
      {const tens=rnd(1,1);const ua=rnd(1,9);const ub=rnd(1,ua);
      a=tens*10+ua;b=ub;ans=a-b;expr=`${a} − ${b}`;break;}
    case 'addC': // carry: a+b crosses a ten
      {do{a=rnd(2,9);b=rnd(2,9);}while((a+b)<10||(a+b)>20||(a%10+b%10)<10);
      ans=a+b;expr=`${a} + ${b}`;break;}
    case 'subC': // borrow: cross ten
      {a=rnd(11,18);do{b=rnd(2,9);}while((a%10)>=(b)||(a-b)<1);
      // Actually force borrowing: units of a < b
      const u=rnd(1,9);b=rnd(u+1,9);a=10+u;ans=a-b;expr=`${a} − ${b}`;break;}
    case 'add100':
      do{a=rnd(1,99);b=rnd(1,99);}while(a+b>100);ans=a+b;expr=`${a} + ${b}`;break;
    case 'sub100':
      a=rnd(2,100);b=rnd(1,a-1);ans=a-b;expr=`${a} − ${b}`;break;
  }
  return{a,b,ans,expr};
}

function genOpts(correct,cat){
  const set=new Set([correct]);
  let tries=0;
  while(set.size<4&&tries<60){
    tries++;
    let v;
    if(cat==='add100'||cat==='sub100') v=correct+rnd(-15,15);
    else v=correct+rnd(-5,5);
    if(v>=0&&v!==correct) set.add(v);
  }
  // fallback
  while(set.size<4) set.add(correct+set.size*2+1);
  return shuffle([...set]);
}

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

// ===== MOVE HERO =====
function moveHero(heroId,trailId,barId,progress){
  const hero=document.getElementById(heroId);
  const road=hero.parentElement;
  const rw=road.offsetWidth||300;
  const maxPx=rw-44-12;
  const px=Math.max(4,Math.min(4+progress*maxPx,rw-44));
  hero.style.left=px+'px';
  hero.style.transform='translateY(-55%) scaleX(-1)';
  if(trailId)document.getElementById(trailId).style.width=(progress*100)+'%';
  if(barId)document.getElementById(barId).style.width=(progress*100)+'%';
}

// ===== SOLO =====
let soloQ={},soloOpts=[],soloScore=0,soloTotal=10,soloAnswered=false;

function startSolo(){
  playClick();currentMode='solo';
  soloScore=0;soloAnswered=false;
  document.getElementById('soloGold').textContent='0';
  document.getElementById('soloCatLabel').textContent=catInfo[selectedCat].label;
  moveHero('soloHero','soloTrail','soloBar',0);
  showScreen('soloScreen');startBg();
  nextSoloQ();
}

function nextSoloQ(){
  soloAnswered=false;
  if(soloScore>=soloTotal){endSolo();return;}
  soloQ=genQ(selectedCat);
  soloOpts=genOpts(soloQ.ans,selectedCat);
  const el=document.getElementById('soloExpr');
  el.style.animation='none';void el.offsetWidth;el.style.animation='qPop 0.35s ease';
  el.textContent=soloQ.expr+' = ?';
  document.getElementById('soloHint').textContent=catInfo[selectedCat].hint;
  document.getElementById('soloInfo').textContent=`Пример ${soloScore+1} / ${soloTotal}`;
  buildGems('soloGems',soloOpts,['g0','g1','g2','g3'],(val,btn)=>{
    if(soloAnswered)return;soloAnswered=true;
    if(val===soloQ.ans){
      btn.classList.add('correct-flash');
      soloScore++;
      document.getElementById('soloGold').textContent=soloScore;
      moveHero('soloHero','soloTrail','soloBar',soloScore/soloTotal);
      playCorrect();goldPopup(btn);
      toast('✅ '+soloQ.expr+' = '+soloQ.ans,'correct');
    } else {
      btn.classList.add('wrong-flash');playWrong();
      toast('❌ Правильно: '+soloQ.expr+' = '+soloQ.ans,'wrong');
      document.querySelectorAll('#soloGems .gem-btn').forEach(b=>{if(parseInt(b.dataset.val)===soloQ.ans)b.classList.add('correct-flash');});
    }
    document.querySelectorAll('#soloGems .gem-btn').forEach(b=>b.disabled=true);
    setTimeout(nextSoloQ,1300);
  });
}

function buildGems(containerId,opts,colors,onAnswer){
  const el=document.getElementById(containerId);el.innerHTML='';
  opts.forEach((val,i)=>{
    const btn=document.createElement('button');
    btn.className=`gem-btn ${colors[i]}`;
    btn.textContent=val;btn.dataset.val=val;
    let _f=false;
    const handler=(e)=>{e.preventDefault();e.stopPropagation();if(_f)return;_f=true;onAnswer(val,btn);setTimeout(()=>{_f=false;},500);};
    btn.addEventListener('touchstart',handler,{passive:false});
    btn.addEventListener('click',handler);
    el.appendChild(btn);
  });
}

function endSolo(){
  stopBg();
  const pct=Math.round(soloScore/soloTotal*100);
  let e,t,g,m;
  if(pct===100){e='🏆';t='Сундук полон!';g='🪙'.repeat(10);m='Все 10 монет! Аладдин богач!';}
  else if(pct>=70){e='🌟';t='Отлично!';g='🪙'.repeat(soloScore);m=soloScore+' из '+soloTotal+' монет!';}
  else if(pct>=50){e='💎';t='Хорошо!';g='🪙'.repeat(soloScore);m=soloScore+' из '+soloTotal+'. Тренируйся!';}
  else{e='🪔';t='Не сдавайся!';g='🪙'.repeat(soloScore)||'—';m=soloScore+' из '+soloTotal+'. Загадай желание!';}
  document.getElementById('resEmoji').textContent=e;
  document.getElementById('resTitle').textContent=t;
  document.getElementById('resGold').textContent=g;
  document.getElementById('resMsg').textContent=m;
  if(pct>=70){confetti();playWin();}else tone(280,.5,'triangle',.12);
  setTimeout(()=>showScreen('results'),500);
}

// ===== DUO =====
let p1={q:{},opts:[],score:0,locked:false};
let p2={q:{},opts:[],score:0,locked:false};
const DUO_WIN=10;
const D1C=['d1g0','d1g1','d1g2','d1g3'];
const D2C=['d2g0','d2g1','d2g2','d2g3'];

function startDuo(){
  playClick();currentMode='duo';
  p1={q:{},opts:[],score:0,locked:false};
  p2={q:{},opts:[],score:0,locked:false};
  ['d1Gold','d2Gold','ds1','ds2'].forEach(id=>document.getElementById(id).textContent='0');
  moveHero('hero1','trail1','bar1',0);moveHero('hero2','trail2','bar2',0);
  document.getElementById('p1CatLabel').textContent=catInfo[selectedCat].label.slice(0,20);
  document.getElementById('p2CatLabel').textContent=catInfo[selectedCat].label.slice(0,20);
  showScreen('duoScreen');startBg();
  newDuoQ(1);newDuoQ(2);
}

function newDuoQ(pl){
  const state=pl===1?p1:p2;
  state.q=genQ(selectedCat);
  state.opts=genOpts(state.q.ans,selectedCat);
  state.locked=false;
  const exprEl=document.getElementById('p'+pl+'Expr');
  exprEl.textContent=state.q.expr+' = ?';
  buildDuoGems('p'+pl+'Gems',state.opts,pl===1?D1C:D2C,(val,btn)=>{
    if(state.locked)return;
    if(val===state.q.ans){
      state.locked=true;
      btn.classList.add('correct-flash');
      state.score++;
      document.getElementById('d'+pl+'Gold').textContent=state.score;
      document.getElementById('ds'+pl).textContent=state.score;
      moveHero('hero'+pl,'trail'+pl,'bar'+pl,state.score/DUO_WIN);
      playCorrect();goldPopup(btn);
      document.getElementById('p'+pl+'Gems').querySelectorAll('.duo-gem').forEach(b=>b.disabled=true);
      if(state.score>=DUO_WIN){setTimeout(()=>endDuo(pl),700);return;}
      setTimeout(()=>newDuoQ(pl),950);
    } else {
      btn.classList.add('wrong-flash');playWrong();
      setTimeout(()=>btn.classList.remove('wrong-flash'),380);
    }
  });
}

function buildDuoGems(containerId,opts,colors,onAnswer){
  const el=document.getElementById(containerId);el.innerHTML='';
  opts.forEach((val,i)=>{
    const btn=document.createElement('button');
    btn.className=`duo-gem ${colors[i]}`;
    btn.textContent=val;btn.dataset.val=val;
    let _f=false;
    const handler=(e)=>{e.preventDefault();e.stopPropagation();if(_f)return;_f=true;onAnswer(val,btn);setTimeout(()=>{_f=false;},500);};
    btn.addEventListener('touchstart',handler,{passive:false});
    btn.addEventListener('click',handler);
    el.appendChild(btn);
  });
}

function endDuo(winner){
  stopBg();confetti();playWin();
  const icons=['🧞','🧞‍♂️'];
  document.getElementById('wEmoji').textContent=winner===1?'🧞':'🧞‍♂️';
  document.getElementById('wTitle').textContent=(winner===1?'Аладдин':'Джин')+' победил! 🏆';
  document.getElementById('wSub').textContent='Монеты: 🧞'+p1.score+' — '+p2.score+'🧞‍♂️';
  document.getElementById('winnerOverlay').classList.add('show');
}

function closeWinner(){document.getElementById('winnerOverlay').classList.remove('show');}
function playAgain(){closeWinner();if(currentMode==='solo')startSolo();else startDuo();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}

window.addEventListener('click',()=>{if(!audioCtx){getCtx();if(musicOn)startBg();}},{once:true});
</script>
