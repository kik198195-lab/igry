#app{max-width:760px;margin:0 auto;padding:10px;min-height:100vh}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ttl{flex:1;text-align:center;background:linear-gradient(var(--wood2),var(--wood));color:#fff;border-radius:14px;padding:8px 10px;font-size:18px;border:3px solid #78350f}
.ic,.st{background:#fff;border:0;border-radius:50%;width:44px;height:44px;font-size:22px;box-shadow:0 4px 0 #0003;display:grid;place-items:center;border-radius:14px;font-family:inherit;font-weight:900;color:var(--ink)}
.st{width:auto;padding:0 10px;font-size:18px}
.logo{margin:6px auto 4px;text-align:center;font-size:40px;line-height:1.05;background:linear-gradient(var(--wood2),var(--wood));border:4px solid #78350f;border-radius:22px;padding:14px 10px;color:#fde047;text-shadow:0 3px 0 #78350f;max-width:420px}
.logo b{display:block;color:#38bdf8;font-size:44px}
.fox{font-size:84px;text-align:center;animation:bob 2.4s ease-in-out infinite}
.balloon{position:absolute;right:14px;top:70px;font-size:54px;animation:bob 3.5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.sub{text-align:center;margin:0 auto 14px;font-size:16px;background:#fffd;border-radius:14px;padding:6px 12px;width:fit-content}
.menu{display:grid;gap:12px;max-width:420px;margin:0 auto}
.btn{border:0;border-radius:22px;padding:16px;font:inherit;font-size:22px;color:#fff;background:linear-gradient(#fbbf24,#f97316);box-shadow:0 6px 0 #c2410c;cursor:pointer}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c2410c}
.btn.g{background:linear-gradient(#4ade80,#16a34a);box-shadow:0 6px 0 #166534}
.btn.b{background:linear-gradient(#60a5fa,#2563eb);box-shadow:0 6px 0 #1e3a8a}
.btn.p{background:linear-gradient(#c084fc,#9333ea);box-shadow:0 6px 0 #581c87}
.card{background:var(--paper);border-radius:22px;padding:14px;box-shadow:0 6px 0 #0002;text-align:center;margin-bottom:14px}
.hint{font-size:20px;text-align:center;margin:6px auto 10px;background:#fffd;border-radius:16px;padding:6px 14px;width:fit-content}
.pic{font-size:78px;line-height:1.1}
.big{font-size:64px;color:#9333ea}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;min-height:70px}
.pool{background:#fff8;border-radius:22px;padding:14px}
.t{min-width:58px;height:62px;padding:0 10px;border-radius:16px;color:#fff;font-size:34px;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 15%,#fffd 0,#fff0 42%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c),#000 32%));box-shadow:0 7px 0 color-mix(in srgb,var(--c),#000 50%),0 14px 14px #0004,inset 0 3px 3px #fff9,inset 0 -5px 6px #0003;text-shadow:0 3px 0 #0004;touch-action:none;cursor:grab}
.t.ghost{visibility:hidden}
.drag{position:fixed;z-index:9;pointer-events:none;transform:translate(-50%,-60%) scale(1.15)}
.sk{min-width:58px;height:62px;border-radius:16px;border:3px dashed #d97706;background:#fff}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.wc{background:var(--paper);border-radius:18px;padding:10px 4px;text-align:center;font-size:17px;box-shadow:0 5px 0 #0002;cursor:pointer}
.wc span{display:block;font-size:44px}
.wc.ok{background:#bbf7d0;outline:4px solid #22c55e}
.cell{aspect-ratio:1;border-radius:16px;font-size:44px;display:grid;place-items:center;background:var(--paper);box-shadow:0 5px 0 #0002;cursor:pointer}
.cell.ok{background:#bbf7d0;outline:4px solid #22c55e}
.words{display:grid;gap:10px;max-width:360px;margin:0 auto}
.words .wc{font-size:28px;padding:12px}
.words u{color:#9333ea;text-decoration:none;font-size:34px}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{position:fixed;inset:0;display:grid;place-items:center;font-size:90px;pointer-events:none;animation:pp .9s forwards;z-index:10}
@keyframes pp{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.2);opacity:1}100%{transform:scale(1);opacity:0}}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.letters .t{width:100%;cursor:pointer}
.flash{font-size:min(36vw,220px);text-align:center;margin:30px 0 10px;-webkit-text-stroke:14px #fff;paint-order:stroke fill;text-shadow:0 8px 0 #0003;font-weight:900}
.bar{height:14px;background:#fff8;border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:#22c55e;width:0;animation:fill linear forwards}
@keyframes fill{to{width:100%}}
textarea{width:100%;font:inherit;font-size:22px;border-radius:16px;border:3px solid #d97706;padding:10px;background:#fff;color:var(--ink)}
.chips{display:flex;gap:8px;justify-content:center;margin:10px 0}
.chip{border:0;border-radius:14px;padding:10px 14px;font:inherit;font-size:18px;background:#fff;color:var(--ink);box-shadow:0 4px 0 #0003}
.chip.on{background:#fde047;outline:3px solid #f59e0b}
.syl{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
.syl .t{font-size:40px;min-height:76px}
.pic{filter:drop-shadow(0 10px 8px #0005);font-size:92px;background:radial-gradient(circle at 50% 62%,#fde68a 0,#fff0 62%)}
.wc span{filter:drop-shadow(0 6px 5px #0005)}
.fox,.balloon{filter:drop-shadow(0 12px 8px #0005)}
.btn{text-shadow:0 2px 0 #0004}
.card,.wc,.cell{box-shadow:0 8px 0 #0002,0 14px 16px #0002,inset 0 3px 0 #fff}
.sk{display:grid;place-items:center}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;justify-items:center}
.cc{display:grid;gap:8px;justify-items:center}.cc .hint{font-size:15px;margin:0}
.cr{display:flex;gap:6px}
.cons{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;align-items:start;--h:clamp(28px,min(calc((100dvh - 150px)/10 - 8px),calc((100vw - 56px)/7.2)),50px)}
.side{display:flex;flex-direction:column;justify-content:space-around;align-items:center;height:calc(10*var(--h) + 72px)}
.cr{gap:4px;justify-content:center}
.cr .t,.cr .sk,.cons .vw{height:var(--h);min-width:calc(var(--h)*.95);font-size:calc(var(--h)*.55);padding:0}
.cr .sk{min-width:calc(var(--h)*.95);background:#fff}
.cons .vw{width:calc(var(--h)*1.05);min-width:0}
.sk.full{border:3px solid #22c55e}
.sk.vt{border:0;color:#fff;background:radial-gradient(ellipse at 30% 15%,#fffd 0,#fff0 42%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c),#000 32%));box-shadow:0 7px 0 color-mix(in srgb,var(--c),#000 50%),0 14px 14px #0004,inset 0 3px 3px #fff9,inset 0 -5px 6px #0003;text-shadow:0 3px 0 #0004}
.vw{cursor:pointer}
#sl,#pl{flex-wrap:nowrap!important;gap:6px}
#sl .t,#pl .t,#sl .sk{flex:1 1 0;min-width:0;max-width:78px;padding:0;font-size:clamp(18px,6vw,34px)}
.pool{padding:10px}
.card{position:relative}
.cm{position:absolute;left:4px;top:4px;height:64px;filter:drop-shadow(0 5px 4px #0005)}
.fox{display:flex;justify-content:center}.fox img{height:150px;filter:drop-shadow(0 10px 8px #0005)}
.cast{display:flex;justify-content:center;align-items:flex-end;margin:6px 0 10px}
.cast img{height:84px;margin:0 -4px;filter:drop-shadow(0 8px 6px #0005)}.cast img:nth-child(3){height:120px;z-index:1}.cast img:nth-child(2),.cast img:nth-child(4){height:96px}
.guide{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:12px}
.guide img{height:96px;filter:drop-shadow(0 8px 6px #0005)}
.bub{background:#fff;border-radius:20px;padding:10px 16px;font-size:20px;box-shadow:0 5px 0 #0002}
body::before{content:"";position:fixed;inset:0;background:rgba(255,255,255,.55);z-index:-1;pointer-events:none}
.title{display:block;width:min(100%,440px);margin:6px auto 4px;filter:drop-shadow(0 8px 8px #0005)}
.cw{--h:clamp(26px,calc((100vw - 96px)/7.6),56px)}
.c4{display:grid;grid-template-columns:repeat(4,auto);justify-content:center;gap:0 22px}
.c4 .cr{gap:2px}
.c4 .cc{gap:14px}
.vpool{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin-top:18px;background:#fff8;border-radius:22px;padding:14px}
.vpool .vw{width:calc(var(--h)*1.6);height:calc(var(--h)*1.6);font-size:calc(var(--h)*.85);min-width:0;padding:0}
#sl.sy .t,#pl.sy .t,#sl.sy .sk{flex:0 1 auto;min-width:88px;max-width:none;padding:0 12px;font-size:clamp(22px,7vw,32px);white-space:nowrap}
#pl.sy{flex-wrap:wrap!important}
@media (min-width:520px){.c4{gap:0 56px}.c4 .cc{gap:20px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

function win(next,msg){clearTimeout(T);app.innerHTML=`<div class=fox><img src="${IMG[sh(Object.keys(IMG))[0]]}" alt=""></div><div class=logo style="font-size:48px">Отлично!</div><p class=sub style="font-size:36px">⭐⭐⭐</p><div class=menu><button class="btn g" onclick="${next}">Далее</button></div>`;snd('win');setTimeout(praise,600)}

/* ---------- Этап 1 ---------- */
function s1menu(){const L=[...'АБВГДЕЁЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯ'];
screen(`${guide('fox','Выбери букву!')}<div class=letters>${L.map(l=>tile(l,`onclick="s1a('${l}')"`)).join('')}</div>`,'Этап 1. Буква')}
function s1a(L){const l=L.toLowerCase(),good=sh(BANK.filter(w=>w[0][0]==l)).slice(0,3),bad=sh(BANK.filter(w=>w[0][0]!=l)).slice(0,5);let left=good.length;if(!left)return s1b(L);
screen(`<div class=card><img class=cm src="${IMG.fox}" alt=""><div class=big style="color:${col(L)}">${L}</div><div class=hint>Найди все слова на букву ${L}</div></div><div class=grid4>${sh([...good,...bad]).map(w=>`<div class=wc data-g=${good.includes(w)?1:0}><span>${w[1]}</span>${w[0]}</div>`).join('')}</div>`,'Слова на '+L);
app.querySelectorAll('.wc').forEach(c=>c.onclick=()=>{if(c.dataset.g=='1'){if(!c.classList.contains('ok')){c.classList.add('ok');stars++;if(!--left){pop('🌟');setTimeout(()=>s1b(L),900)}}}else shake(c)})}
function s1b(L){const l=L.toLowerCase();let left=4;const c=sh([...Array(4).fill(l),...sh([...'абвгдеёжзийклмнопрстуфхцчшщъыьэюя'].filter(x=>x!=l)).slice(0,8)]);
screen(`<div class=hint>Найди все буквы ${L}</div><div class=grid4>${c.map(x=>`<div class=cell data-g=${x==l?1:0} style="color:${col(x)}">${x.toUpperCase()}</div>`).join('')}</div>`,'Найди букву '+L);
app.querySelectorAll('.cell').forEach(e=>e.onclick=()=>{if(e.dataset.g=='1'){if(!e.classList.contains('ok')){e.classList.add('ok');stars++;if(!--left){pop('🌟');setTimeout(()=>s1c(L),900)}}}else shake(e)})}
function s1c(L){const l=L.toLowerCase(),good=sh(BANK.filter(w=>w[0].includes(l))).slice(0,3),bad=sh(BANK.filter(w=>!w[0].includes(l))).slice(0,3);let left=good.length;if(!left)return win('s1menu()');
screen(`<div class=hint>Найди слова, где есть буква ${L}</div><div class=words>${sh([...good,...bad]).map(w=>`<div class=wc data-g=${good.includes(w)?1:0} data-w=${w[0]}>${w[0].toUpperCase()}</div>`).join('')}</div>`,'Буква в словах');
app.querySelectorAll('.wc').forEach(e=>e.onclick=()=>{if(e.dataset.g=='1'){if(!e.classList.contains('ok')){e.classList.add('ok');e.innerHTML=[...e.dataset.w].map(c=>c==l?`<u>${c.toUpperCase()}</u>`:c.toUpperCase()).join('');stars++;if(!--left){pop('🌟');setTimeout(()=>win('s1menu()'),1000)}}}else shake(e)})}

/* ---------- Этап 2 ---------- */
function s2menu(){screen(`${guide('owl','Выбери задание!')}<div class=menu><button class="btn g" onclick="consMenu()">🪜 Согласный + гласные</button><button class="btn b" onclick="s2a()">🧩 Составь слог из букв</button><button class="btn p" onclick="teacher()">👩‍🏫 Читаем слоги (для учителя)</button></div>`,'Этап 2. Слоги')}
function s2a(){const C=[...'мспкнлртбдвгзшх'],V=[...'аоуыи'];
const R=Array.from({length:6},()=>{const c=C[Math.random()*C.length|0],v=V[Math.random()*V.length|0];return{t:[c,v],pool:sh([c,v,...sh(ALF.filter(x=>x!=c&&x!=v)).slice(0,2)]),pic:`<span class=big><span style="color:${ccol(c,v)}">${c.toUpperCase()}</span><span style="color:#dc2626">${v.toUpperCase()}</span></span>`,h:'Составь такой слог',say:c+v}});
play(R,0,'Составь слог','s2menu()')}
function teacher(){screen(`<div class=card><div class=hint>Слоги через запятую или пробел</div><textarea id=sy rows=3>${SYL}</textarea>
<div class=hint>Время показа каждого слога, сек</div><div class=chips>${[1,2,3,5,8].map(s=>`<button class="chip ${s==SEC?'on':''}" onclick="SEC=${s};keep();teacher()">${s}</button>`).join('')}</div></div>
<div class=menu><button class="btn g" onclick="keep();flash(0)">▶ Показать по очереди</button><button class="btn b" onclick="keep();allSyl()">📋 Показать все вместе</button></div>`,'Читаем слоги','s2menu()')}
const keep=()=>{const e=document.getElementById('sy');if(e)SYL=e.value};
const list=()=>SYL.split(/[\s,;]+/).filter(Boolean);
function flash(k){const L=list();if(!L.length)return teacher();clearTimeout(T);
if(k>=L.length)return teacher();
screen(`<div class=flash style="color:${col(L[k])}">${L[k].toUpperCase()}</div><div class=bar><i style="animation-duration:${SEC}s"></i></div><p class=sub>${k+1} из ${L.length}</p>`,'Читаем','teacher()');
T=setTimeout(()=>flash(k+1),SEC*1000)}
function allSyl(){screen(`<div class=hint>Читаем все вместе!</div><div class=syl>${list().map(s=>tile(s)).join('')}</div>`,'Все слоги','teacher()')}

/* Согласный + гласные */
const VOW=[...'аоуыэяёюеи'],CON=[...'бвгджзйклмнпрстфхцчшщ'];
function consMenu(){screen(`${guide('bear','Выбери согласный!')}<div class=letters>${CON.map(l=>tile(l,`onclick="cons('${l}')"`)).join('')}</div>`,'Согласный','s2menu()')}
function cons(c){SELV=null;const row=m=>`<div class=cr>${m?'':'<div class=sk data-m=pre data-c="'+c+'"></div>'}${tile(c,'',ccol(c))}${m?'<div class=sk data-m=post data-c="'+c+'"></div>':''}</div>`,cc=m=>`<div class=cc>${[0,1,2,3,4].map(()=>row(m)).join('')}</div>`;
screen(`<div class=hint style="font-size:14px;margin:0 auto 8px">Слева — гласная впереди, справа — сзади</div><div class=cw><div class=c4>${cc(0)}${cc(0)}${cc(1)}${cc(1)}</div><div class=vpool>${sh(VOW).map(v=>`<div class="t vw" data-v="${v}" style="--c:#dc2626;transform:rotate(${Math.random()*30-15|0}deg)">${v.toUpperCase()}</div>`).join('')}</div><p class=sub style="font-size:13px;margin-top:12px"><b style="color:#dc2626">гласные</b> · <b style="color:#2563eb">твёрдые</b> · <b style="color:#16a34a">мягкие</b></p></div>`,'Согласный '+c.toUpperCase(),'consMenu()')}

/* ---------- Этап 3 ---------- */
function s3menu(){screen(`${guide('bunny','Составим слова!')}<div class=menu><button class="btn g" onclick="s3(1)">🔤 Слово из букв</button><button class="btn b" onclick="s3(2)">🔀 Буквы вперемешку</button><button class="btn p" onclick="s3(3)">🖼️ Назови картинку</button><button class="btn" onclick="s3(4)">🧱 Слово из слогов</button></div>`,'Этап 3. Слова')}
function s3(m){let W=sh(BANK);if(m==4)W=W.filter(w=>w[2]);W=W.slice(0,5);const SY=BANK.filter(w=>w[2]).flatMap(w=>w[2].split('-'));
const R=W.map(w=>{const L=[...w[0]];let pool=sh(L),h='Составь слово',pic=w[1],t=L;
if(m==2){pic='❓';h='Что получится?'}
if(m==3){pool=sh([...L,...sh(ALF.filter(x=>!L.includes(x))).slice(0,3)]);h='Напиши название картинки'}
if(m==4){t=w[2].split('-');pool=sh([...t,...sh(SY.filter(s=>!t.includes(s))).slice(0,2)]);h='Собери слово из слогов'}
return{t,pool,pic,h,e:w[1],say:w[0]}});
play(R,0,'Составь слово','s3menu()')}

/* ---------- Движок перетаскивания ---------- */
let G=null,D=null;
function play(R,i,title,back){if(i>=R.length)return win(back);const r=R[i];
G={R,i,r,title,back,S2:back=='s2menu()',pool:r.pool,fill:Array(r.t.length).fill(null),lock:false};
screen(`<div class=card><img class=cm src="${IMG[back=='s2menu()'?'owl':'bunny']}" alt=""><div class=pic id=pic>${r.pic}</div><div class=hint>${r.h} ${(r.say||r.t.join('')).length>2?`<button class=chip onclick="say(G.r.say||G.r.t.join(''))">🔊</button>`:''}</div><div class="row ${r.t.some(x=>x.length>1)?'sy':''}" id=sl></div></div><div class="row pool ${r.t.some(x=>x.length>1)?'sy':''}" id=pl></div>`,title+' '+(i+1)+'/'+R.length,back);
if(r.say&&r.pic.includes('big'))say(r.say);draw()}
function draw(){const{pool,fill}=G;
document.getElementById('sl').innerHTML=fill.map((f,k)=>f===null?`<div class=sk data-k=${k}></div>`:tile(pool[f],`data-p=${f} data-k=${k}`,G.S2?lcol(pool[f]):0)).join('');
document.getElementById('pl').innerHTML=pool.map((p,j)=>fill.includes(j)?`<div class="t ghost"></div>`:tile(p,`data-p=${j}`,G.S2?lcol(p):0)).join('')}
function check(){if(G.fill.includes(null))return;G.lock=true;
const ok=G.fill.map(f=>G.pool[f]).join('')==G.r.t.join('');
if(ok){stars++;if(G.r.e)document.getElementById('pic').textContent=G.r.e;pop('⭐');say(G.r.say||G.r.t.join(''));const g=G;setTimeout(praise,900);setTimeout(()=>play(g.R,g.i+1,g.title,g.back),1900)}
else{shake(document.getElementById('sl'));setTimeout(()=>{G.fill.fill(null);G.lock=false;draw()},700)}}
function put(p,k){const f=G.fill;const old=f.indexOf(p);if(old>-1)f[old]=null;
if(k==null)k=f.indexOf(null);if(k<0)return;f[k]=p;snd('put');draw();check()}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.t[data-p]');if(!t||!G||G.lock)return;
D={p:+t.dataset.p,x:e.clientX,y:e.clientY,t,g:null,inSlot:t.dataset.k!==undefined}});
document.addEventListener('pointermove',e=>{if(!D)return;
if(!D.g&&Math.hypot(e.clientX-D.x,e.clientY-D.y)>8){D.g=D.t.cloneNode(true);D.g.className='t drag';document.body.appendChild(D.g)}
if(D.g){D.g.style.left=e.clientX+'px';D.g.style.top=e.clientY+'px'}});
document.addEventListener('pointerup',e=>{if(!D)return;const d=D;D=null;
if(!d.g){if(d.inSlot){G.fill[G.fill.indexOf(d.p)]=null;draw()}else put(d.p);return}
d.g.remove();const el=document.elementFromPoint(e.clientX,e.clientY),s=el&&el.closest('[data-k]');
if(s&&el.closest('#sl')){const k=+s.dataset.k;if(G.fill[k]!==null&&G.fill[k]!==d.p)G.fill[k]=null;put(d.p,k)}
else if(d.inSlot){G.fill[G.fill.indexOf(d.p)]=null;draw()}});
document.addEventListener('pointercancel',()=>{if(D&&D.g)D.g.remove();D=null;if(V&&V.g)V.g.remove();V=null});
let V=null,SELV=null;
function fillSlot(s,v){const c=s.dataset.c,x=s.dataset.m=='pre'?v+c:c+v;if(!s.dataset.f){s.dataset.f=1;stars++;const st=document.querySelector('.st');if(st)st.textContent='⭐ '+stars}s.textContent=v.toUpperCase();s.style.setProperty('--c','#dc2626');s.classList.add('full','vt');const ct=s.parentElement.querySelector('.t:not(.vw)');if(ct)ct.style.setProperty('--c',ccol(c,s.dataset.m=='post'?v:null));snd('put');say(x)}
document.addEventListener('pointerdown',e=>{const t=e.target.closest('.vw');if(t)V={v:t.dataset.v,x:e.clientX,y:e.clientY,t,g:null}});
document.addEventListener('pointermove',e=>{if(!V)return;if(!V.g&&Math.hypot(e.clientX-V.x,e.clientY-V.y)>8){V.g=V.t.cloneNode(true);V.g.className='t drag';V.g.style.transform='';document.body.appendChild(V.g)}if(V.g){V.g.style.left=e.clientX+'px';V.g.style.top=e.clientY+'px'}});
document.addEventListener('pointerup',e=>{if(!V)return;const d=V;V=null;if(!d.g){document.querySelectorAll('.vw').forEach(x=>x.style.outline='');SELV=d.v;d.t.style.outline='4px solid #fde047';snd('tap');return}d.g.remove();const el=document.elementFromPoint(e.clientX,e.clientY),s=el&&el.closest('.sk[data-m]');if(s)fillSlot(s,d.v)});
document.addEventListener('click',e=>{if(e.target.closest('.btn,.chip,.ic,.letters .t'))snd('tap');const x=e.target.closest('.wc,.cell');if(x&&x.classList.contains('ok'))snd('put');const s=e.target.closest('.sk[data-m]');if(s){if(SELV)fillSlot(s,SELV);else if(s.dataset.f){const q=s.textContent.toLowerCase();say(s.dataset.m=='pre'?q+s.dataset.c:s.dataset.c+q)}}});
home();
</script></body></html>
