h1{font-size:24px;margin:0 0 4px;text-align:center}
.sub{text-align:center;margin:0 0 6px;font-size:17px}

.gw{overflow-x:auto;max-width:1500px;margin:0 auto}.grid{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:4px;min-width:820px}
.pen{text-align:center;cursor:pointer}
.pic{position:relative;container-type:inline-size}
.pic img.pg{width:100%;display:block}
.hq{position:absolute;transform:translate(-50%,-50%);font-weight:700;color:#4a6ff0;font-size:7cqw;text-transform:uppercase;white-space:nowrap;cursor:pointer;line-height:1}
.ws{position:absolute;width:46%;transform:translate(-50%,-50%);left:66%;top:60%}
.ws.empty{aspect-ratio:1}
.ws img{width:100%;display:block;cursor:pointer}
.nm{font-weight:700;font-size:17px;margin-top:2px;text-shadow:0 0 4px #fff,0 0 6px #fff,0 0 8px #fff}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:1020px;margin:14px auto;padding:10px;background:#ffffffb0;border-radius:16px;min-height:100px}
.sb{position:relative;width:96px;cursor:pointer;user-select:none;transition:transform .15s}
.sb img{width:100%;display:block}
.sb span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#4a6ff0;text-transform:uppercase;text-align:center}
.sb.wd{width:120px}
.sb.sel{transform:scale(1.15);filter:drop-shadow(0 0 6px var(--ac))}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0}
button{font:inherit;font-weight:700;font-size:17px;padding:8px 16px;border-radius:12px;border:2px solid var(--ac);background:#fff;color:#1d2b4f;cursor:pointer}
button.on{background:var(--ac);color:#fff}
.c{text-align:center;margin:10px}
[data-pool],[data-back]{touch-action:none}img{-webkit-user-drag:none}
.cs{position:relative;container-type:inline-size;width:100%}.cs img{width:100%;display:block}
.cs span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:#4a6ff0;text-transform:uppercase;text-align:center}
.modal{position:fixed;inset:0;background:#0006;z-index:100;display:flex;align-items:center;justify-content:center;padding:10px}
.box{background:#fff;color:#12405f;border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:100%;overflow:auto}
.box h3{margin:0 0 4px}.box p{margin:0 0 6px;font-size:15px}.box label{display:block;font-size:15px;margin:6px 0}
.box input{width:100%;box-sizing:border-box;font:inherit;padding:6px;border:2px solid #9bbbe0;border-radius:8px}.box input.bad{border-color:var(--bad)}
.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-50%);opacity:.92}
.top{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:4px 0 8px}
.ps{max-width:1500px;margin:0 auto 12px;padding:6px;border-radius:18px}
.two .ps{border:3px solid var(--pc);background:#ffffff35}
.two .gw{max-width:1150px}.two .sb{width:80px}.two .sb.wd{width:96px}.two .sb span{font-size:15px}
.ph{text-align:center;font-weight:700;font-size:22px;color:var(--pc)}
.msg{text-align:center;min-height:26px;font-weight:700;font-size:18px;margin:2px 0}
.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pl{position:absolute;width:29%;transform:translate(-50%,-50%)}.pl img{width:100%;display:block}
.sp{transform-box:fill-box;transform-origin:center;animation:spk .45s infinite alternate}
@keyframes spk{from{transform:scale(.65) rotate(0)}to{transform:scale(1.2) rotate(30deg)}}
.end h2{margin:6px 0}.end svg{max-width:680px;width:100%;display:block;margin:0 auto}
.blk{opacity:0;transform-box:fill-box;transform-origin:center;animation:drp .45s ease-out forwards}
@keyframes drp{from{opacity:0;transform:translateY(-40px) scale(.6)}to{opacity:1;transform:none}}
.tw{animation:tw 1s infinite alternate}@keyframes tw{from{opacity:.3}to{opacity:1}}
.fl{animation:fall 6s linear infinite}@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(370px)}}
body{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}
.hop{animation:hop .38s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-10px)}}
.ps{touch-action:manipulation}
@media (min-width:900px){.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;touch-action:none}
.two .ps{margin:0;min-width:0;padding:4px}.two .gw{overflow:visible}.two .grid{gap:2px}
.two .nm{font-size:12px}.two .hq{font-size:max(7cqw,10px)}.two .sub{font-size:14px;margin:2px 0}.two .sb{width:70px}.two .sb.wd{width:84px}.two .sb span{font-size:13px}.two .pool{padding:6px;gap:6px;min-height:80px}.two .tabs button{padding:4px 8px;font-size:14px}}
.dev{text-align:center;font-size:12px;line-height:1.5;color:#12405f;opacity:.5;margin:18px 0 6px;font-family:system-ui,sans-serif}.dev a{color:inherit;text-decoration:underline;cursor:pointer}

.gw{overflow:visible}.grid{min-width:0;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1150px){.grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (min-width:900px){.two .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1500px){.two .grid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width:1149px){.pool{max-height:34vh;overflow-y:auto}.one .pool{position:sticky;bottom:4px;z-index:6;background:#ffffffe8;box-shadow:0 -3px 12px #0003}}
@media (max-width:699px){body{padding:8px}h1{font-size:20px}.sub{font-size:15px}.msg{font-size:16px}.tabs button,.top button{padding:6px 10px;font-size:15px}.nm{font-size:14px}.sb{width:68px}.sb.wd{width:82px}.sb span{font-size:14px}.pool{gap:6px;padding:6px}.dev{font-size:11px}}
@media (min-width:1800px){h1{font-size:34px}.sub{font-size:22px}.msg{font-size:24px}.nm{font-size:22px}button{font-size:22px}.sb{width:120px}.sb.wd{width:150px}.sb span{font-size:22px}.ps{max-width:1800px}.gw{max-width:1800px}.two .nm{font-size:16px}.two .sb{width:92px}.two .sb.wd{width:110px}.two .sb span{font-size:17px}.dev{font-size:15px}}
@media (max-height:520px) and (orientation:landscape){.pool{max-height:30vh}.nm{font-size:12px}}

@media (min-width:900px){
.grid .pic{width:min(100%,calc((100vh - 400px)/1.42));margin:0 auto}
.two .grid{grid-template-columns:repeat(6,minmax(0,1fr))}
.two .grid .pic{width:min(100%,calc((100vh - 340px)/1.42))}
.two .sub{display:none}.ph{font-size:18px}.p2 h1{display:none}.p2 .top{margin:2px 0 4px}
.pool{position:sticky;bottom:4px;z-index:6;background:#ffffffe8;max-height:30vh;overflow-y:auto}
}
@media (min-width:600px) and (max-width:899px){.two .grid{grid-template-columns:repeat(6,minmax(0,1fr))}}

.pool.s1 .sb{width:58px}.pool.s1 .sb span{font-size:12px}.pool.s1{min-height:0}
@media (min-width:900px){.one .pool.s1{flex-wrap:nowrap;gap:4px;padding:4px 6px;max-height:none;overflow:hidden}
.one .pool.s1 .sb{flex:1 1 0;min-width:0;width:auto;max-width:82px;container-type:inline-size}
.one .pool.s1 .sb span{font-size:min(17px,17cqw)}.one .pool.s1 b{font-size:16px}}
@media (min-width:1800px){.one .pool.s1 .sb{max-width:104px}.one .pool.s1 .sb span{font-size:min(22px,17cqw)}}

 const peng=`<g transform="translate(468 322) scale(.95)"><g class="blk" style="animation-delay:${pd}s"><g class="hop"><ellipse cx="-16" cy="-3" rx="15" ry="6" fill="#ff9a1f"/><ellipse cx="16" cy="-3" rx="15" ry="6" fill="#ff9a1f"/><path d="M-30 -72Q-58 -80 -64 -118Q-52 -112 -42 -92Q-34 -80 -28 -62Z" fill="#111"/><path d="M30 -72Q58 -80 64 -118Q52 -112 42 -92Q34 -80 28 -62Z" fill="#111"/><ellipse cy="-48" rx="33" ry="46" fill="#111"/><ellipse cy="-42" rx="22" ry="36" fill="#f4f4f4"/><ellipse cy="-92" rx="28" ry="25" fill="#111"/><ellipse cx="-10" cy="-93" rx="8" ry="10" fill="#fff"/><ellipse cx="10" cy="-93" rx="8" ry="10" fill="#fff"/><circle cx="-9" cy="-93" r="3.5" fill="#111"/><circle cx="11" cy="-93" r="3.5" fill="#111"/><circle cx="-8" cy="-95" r="1.2" fill="#fff"/><circle cx="12" cy="-95" r="1.2" fill="#fff"/><circle cx="-19" cy="-81" r="5" fill="#ff9aa8" opacity=".75"/><circle cx="19" cy="-81" r="5" fill="#ff9aa8" opacity=".75"/><path d="M-9 -82Q0 -60 9 -82Z" fill="#ff9a1f"/><path d="M-5.5 -79Q0 -67 5.5 -79Z" fill="#e0525a"/><g transform="translate(2 -108) rotate(-8) scale(.2)"><path d="M-140 0C-130 -80 -60 -160 30 -190C90 -150 130 -70 140 0Z" fill="#d6252e"/><path d="M-100 -10C-90 -80 -50 -140 0 -165C-40 -110 -50 -60 -50 -10Z" fill="#a8161f" opacity=".45"/><rect x="-152" y="-24" width="304" height="46" rx="23" fill="#fff"/><circle cx="30" cy="-196" r="27" fill="#fff"/></g><line x1="62" y1="-116" x2="86" y2="-152" stroke="#666" stroke-width="3.5" stroke-linecap="round"/><line x1="62" y1="-116" x2="86" y2="-152" stroke="#ccc" stroke-width="1.3" stroke-linecap="round"/><g transform="translate(86 -152)"><g class="sp"><path d="M0-19V19M-19 0H19M-13-13L13 13M-13 13L13-13" stroke="#ffc933" stroke-width="3" stroke-linecap="round"/><path d="M0-12V12M-12 0H12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><circle r="4.5" fill="#fff"/></g><circle class="tw" cx="22" cy="-14" r="2" fill="#ffd23f"/><circle class="tw" cx="-20" cy="-18" r="2" fill="#fff" style="animation-delay:.3s"/><circle class="tw" cx="-18" cy="16" r="2" fill="#ffd23f" style="animation-delay:.6s"/></g></g></g></g>`;
 SC=`<svg viewBox="0 0 760 360"><ellipse cx="380" cy="335" rx="390" ry="42" fill="#fff"/><g fill="#f4fbff" stroke="#8fc0de" stroke-width="2">${b}</g><path class="blk" style="animation-delay:${late}s" d="M225 300V262Q250 232 275 262V300Z" fill="#3d6ea8"/><rect class="blk" style="animation-delay:${late}s" x="140" y="226" width="44" height="40" rx="6" fill="#ffd96b" stroke="#8fc0de" stroke-width="3"/><path d="M162 226V266M140 246H184" stroke="#8fc0de" stroke-width="3"/><g transform="translate(110 0)"><g class="blk" style="animation-delay:${late}s"><rect x="510" y="288" width="22" height="30" fill="#8a5a33"/><path d="M430 292H610L520 212Z" fill="#2f8f5b"/><path d="M448 240H592L520 168Z" fill="#3aa06a"/><path d="M466 196H574L520 124Z" fill="#46b377"/><path d="M520 100l7 15 17 2-12 11 4 16-16-9-16 9 4-16-12-11 17-2z" fill="#ffd23f"/>${orn}<rect x="418" y="306" width="30" height="24" fill="#e23b3b"/><rect x="418" y="314" width="30" height="5" fill="#ffd23f"/><rect x="590" y="310" width="26" height="20" fill="#3b7be2"/></g></g>${peng}${fl}</svg>`;return SC}
const endHTML=p=>`<div class="end"><h2>🏠 Построили домик! Молодцы! 🎄</h2>${NP==2?`<p><b>Игрок ${p.i+1}</b> построил домик!</p>`:''}${scene()}<div class="c"><button data-music="1">🔔 Музыка</button> <button data-hide="1" class="on">К пингвинам</button> <button data-reset="1">Играть снова</button></div></div>`;
function renderP(p){
 const el=$('ps'+p.i);
 if(p.end){el.innerHTML=endHTML(p);return}
 let h=NP==2?`<div class="ph">Игрок ${p.i+1} ⭐ ${score(p)}</div>`:'';
 h+=`<p class="sub">${p.stage==1?'Этап 1: отправь снежок с вопросом к нужному пингвину (падежу): нажми или перетащи.':'Этап 2: слово «'+esc(W[p.wi][0])+'» — раскидай снежки по падежам. Вопросы подсказывают!'}</p>`;
 h+=`<div class="tabs"><button data-stage="1" class="${p.stage==1?'on':''}">Этап 1</button><button data-stage="2" class="${p.stage==2?'on':''}">Этап 2</button>`;
 if(p.stage==2)h+=W.map((w,k)=>`<button data-tab="${k}" class="${k==p.wi?'on':''}">${doneW(p,k)?'✓ ':''}${esc(w[0])}</button>`).join('')+'<button data-add="1">➕ Свои слова</button>';
 h+=`</div><div class="msg" style="color:${p.mc||'inherit'}">${p.msg}</div><div class="gw"><div class="grid">`+C.map((c,i)=>`<div class="pen" data-pen="${i}">${pic(p,i)}<div class="nm">${c.n}</div></div>`).join('')+'</div></div>';
 const pl=poolItems(p);
 h+='<div class="pool'+(p.stage==1?' s1':'')+'">'+(pl.length?pl.map(x=>p.stage==1?`<div class="sb ${p.sel==x.id?'sel':''}" data-pool="${x.id}"><img src="${IMG.blank}"><span>${x.t}</span></div>`:`<div class="sb wd ${p.sel==x.id?'sel':''}" data-pool="${x.id}">${snow(x,'')}</div>`).join(''):'<b style="font-size:18px">Все снежки на местах! ⛄</b>')+'</div>';
 if(p.stage==1&&p.pen.every(a=>a[0]&&a[1]))h+='<div class="c"><button class="on" data-stage="2">К этапу 2 ➜</button></div>';
 if(p.stage==2&&doneW(p,p.wi)){
  const nx=(p.wi<6?[0,1,2,3,4,5]:W.map((w,k)=>k).filter(k=>k>=6)).find(k=>!doneW(p,k));
  h+=nx!==undefined?`<div class="c"><button class="on" data-tab="${nx}">Следующее слово ➜</button></div>`:`<div class="c"><b style="font-size:19px">🎉 Все слова распределены!</b> ${p.shown?'<button data-end="1">🏠 Домик</button>':''}</div>`}
 el.innerHTML=h}
function renderTop(){$('top').innerHTML=`<div class="top"><button data-mode="1" class="${NP==1?'on':''}">1 игрок</button><button data-mode="2" class="${NP==2?'on':''}">2 игрока</button><button data-snd="1">${snd?'🔔 Звук вкл':'🔕 Звук выкл'}</button><button data-fs="1">⛶ На весь экран</button></div>`}
function renderAll(){renderTop();const a=$('app');a.className=NP==2?'two':'one';document.body.classList.toggle('p2',NP==2);
 a.innerHTML=P.map(p=>`<section class="ps" id="ps${p.i}" data-p="${p.i}" style="--pc:${p.i?'#e8741f':'#2f62e0'}"></section>`).join('');P.forEach(renderP)}
function newGame(n){NP=n;P=[...Array(n)].map((_,i)=>newP(i));renderAll()}
function shake(p,ci){const e=document.querySelector(`#ps${p.i} [data-pen="${ci}"]`);if(e)e.classList.add('shake')}
/* ---- свои слова ---- */
function openAdd(){
 const m=document.createElement('div');m.className='modal';
 m.innerHTML='<div class="box"><h3>Свои слова</h3><p>Впиши слово во всех падежах (в предложном — с предлогом, например «о доме»).</p>'+C.map((c,i)=>`<label>${c.n} (${c.q.join(' ')})<input data-f="${i}"></label>`).join('')+'<div class="c"><button class="on" data-save="1">Добавить</button> <button data-cancel="1">Отмена</button></div></div>';
 document.body.appendChild(m);m.querySelector('input').focus()}
function saveAdd(){
 const ins=[...document.querySelectorAll('.modal input')];let bad=false;
 ins.forEach(i=>{i.classList.toggle('bad',!i.value.trim());if(!i.value.trim())bad=true});if(bad)return;
 const f=ins.map(i=>i.value.trim().toLowerCase());
 W.push([f[0],f]);P.forEach(q=>q.S2.push(mk(W.length-1,W[W.length-1])));
 const q=P[addFor];q.wi=W.length-1;q.stage=2;q.sel=null;q.end=false;q.msg='Слово добавлено!';q.mc='var(--ok)';
 document.querySelector('.modal').remove();P.forEach(renderP)}
/* ---- нажатия и перетаскивание (pointer events: работает у двоих одновременно) ---- */
function drop(p,it,ci,prev){
 if(ok(p,it,ci)){put(p,it,ci);p.msg='Верно! ✅';p.mc='var(--ok)';afterPut(p);return true}
 if(prev>=0)put(p,it,prev);p.msg='Не подходит, попробуй другого пингвина';p.mc='var(--bad)';return false}
const SEL='[data-pool],[data-back],[data-pen],[data-tab],[data-stage],[data-reset],[data-add],[data-save],[data-cancel],[data-mode],[data-snd],[data-end],[data-hide],[data-music],[data-fs]';
let lastEv=0;
function tap(t){
 lastEv=Date.now();const d=t.dataset;
 if(d.fs){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(x){}return}
 if(d.reset){location.reload();return}
 if(d.mode){newGame(+d.mode);return}
 if(d.snd){snd=!snd;renderTop();return}
 if(d.save){saveAdd();return}
 if(d.cancel){document.querySelector('.modal').remove();return}
 const sec=t.closest('.ps');if(!sec)return;
 const p=P[+sec.dataset.p];
 if(d.music){jingle();return}
 if(d.end){p.end=true;renderP(p);return}
 if(d.hide){p.end=false;renderP(p);return}
 if(d.add){addFor=p.i;openAdd();return}
 if(d.stage){p.stage=+d.stage;p.sel=null;p.msg='';renderP(p);return}
 if(d.tab!==undefined){p.wi=+d.tab;p.sel=null;p.msg='';renderP(p);return}
 if(d.pool){p.sel=p.sel==d.pool?null:d.pool;p.msg=p.sel?'Теперь нажми на пингвина':'';p.mc='';renderP(p);return}
 if(d.back){unput(p,d.back);p.sel=null;p.msg='Снежок вернулся';p.mc='';renderP(p);return}
 const pc=t.closest('[data-pen]');
 if(pc){
  if(!p.sel){p.msg='Сначала выбери снежок внизу';p.mc='var(--ac)';renderP(p);return}
  const it=poolItems(p).find(x=>x.id==p.sel),ci=+pc.dataset.pen;
  p.sel=null;const good=drop(p,it,ci,-1);renderP(p);if(!good)shake(p,ci)}}
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('pointerdown',e=>{
 actx();
 const t=e.target.closest(SEL);if(!t)return;
 const sec=t.closest('.ps');
 drags.set(e.pointerId,{t,p:sec?P[+sec.dataset.p]:null,id:t.dataset.pool||t.dataset.back,placed:!t.dataset.pool,x:e.clientX,y:e.clientY,on:false,g:null,th:e.pointerType=='mouse'?6:24})});
document.addEventListener('pointermove',e=>{
 const d=drags.get(e.pointerId);if(!d||!d.id)return;
 if(!d.on){
  if(Math.hypot(e.clientX-d.x,e.clientY-d.y)<d.th)return;
  const it=items(d.p).find(x=>x.id==d.id);if(!it){drags.delete(e.pointerId);return}
  d.on=true;d.p.sel=null;
  const g=document.createElement('div');g.className='ghost sb'+(d.p.stage==2?' wd':'');
  g.innerHTML=d.p.stage==1?`<img src="${IMG.blank}"><span>${it.t}</span>`:snow(it,'');
  document.body.appendChild(g);d.g=g;d.t.style.opacity=.3}
 d.g.style.left=e.clientX+'px';d.g.style.top=e.clientY+'px'});
function endDrag(e,cancel){
 const d=drags.get(e.pointerId);if(!d)return;drags.delete(e.pointerId);
 if(!d.on){if(!cancel&&Math.hypot(e.clientX-d.x,e.clientY-d.y)<Math.max(12,d.th+4))tap(d.t);return}
 lastEv=Date.now();
 const p=d.p;d.g.remove();
 const it=items(p).find(x=>x.id==d.id);
 let pc=cancel?null:document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-pen]');
 if(pc&&pc.closest('.ps').dataset.p!=p.i)pc=null;
 let prev=-1,good=true;
 if(d.placed){prev=locate(p,d.id);unput(p,d.id)}
 if(pc)good=drop(p,it,+pc.dataset.pen,prev);
 else if(d.placed){p.msg='Снежок вернулся';p.mc=''}
 renderP(p);if(!good)shake(p,+pc.dataset.pen)}
document.addEventListener('click',e=>{if(Date.now()-lastEv<700)return;const t=e.target.closest(SEL);if(t)tap(t)});
document.addEventListener('pointerup',e=>endDrag(e));
document.addEventListener('pointercancel',e=>endDrag(e,true));
newGame(1);

</script></body></html>
