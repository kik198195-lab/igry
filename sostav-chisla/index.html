<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Состав числа</title>
<style>
:root{
  --sky:#d9f0ff; --ink:#1d4f7a; --card:rgba(255,255,255,.88);
  --blue:#3fa7e8; --yellow:#ffd84d; --green:#4cc36b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--sky);color:var(--ink);
  font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-x:hidden}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:8px 12px 10px;display:flex;flex-direction:column;
  height:100vh;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
#home{flex:1;overflow:auto;min-height:0}
#play{flex:1;min-height:0;display:flex;flex-direction:column}
#play[hidden],#home[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;flex:0 0 auto}
.btn{border:0;border-radius:18px;padding:10px 16px;font:inherit;font-size:18px;color:#fff;background:var(--blue);
  box-shadow:0 5px 0 #2a82bb;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #2a82bb}
.btn.green{background:var(--green);box-shadow:0 5px 0 #2f9a4c}
.btn.green:active{box-shadow:0 1px 0 #2f9a4c}
.btn.round{width:44px;height:44px;flex:0 0 auto;padding:0;font-size:22px;border-radius:50%}
h1{font-size:clamp(30px,8vw,48px);margin:10px 0 4px;text-align:center;text-shadow:0 3px 0 #fff}
.sub{text-align:center;font-size:18px;margin:0 0 22px;opacity:.85}
.home{display:flex;flex-direction:column;gap:16px;margin-top:8px}
.range{border:0;border-radius:30px;background:var(--card);color:var(--ink);font:inherit;padding:18px 12px;cursor:pointer;
  box-shadow:0 8px 0 rgba(63,167,232,.55)}
.range:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(63,167,232,.55)}
.range b{display:block;font-size:clamp(36px,11vw,56px);line-height:1.1}
.range span{font-size:clamp(16px,4.5vw,22px);opacity:.8}
.range.y{background:var(--yellow);box-shadow:0 8px 0 #d9ad1c}
.range.y:active{box-shadow:0 3px 0 #d9ad1c}
.range.g{background:#9be3b0;box-shadow:0 8px 0 #4fae75}
.range.g:active{box-shadow:0 3px 0 #4fae75}
.tabs{display:flex;gap:6px;flex:1;background:rgba(255,255,255,.6);padding:4px;border-radius:20px}
.tab{flex:1;border:0;border-radius:16px;padding:9px 4px;font:inherit;font-size:clamp(13px,3.9vw,19px);background:transparent;color:var(--ink);cursor:pointer}
.tab.on{background:var(--blue);color:#fff;box-shadow:0 4px 0 #2a82bb}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 6px;scrollbar-width:none;flex:0 0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{position:relative;flex:0 0 auto;min-width:42px;height:40px;border:0;border-radius:14px;background:var(--card);color:var(--ink);
  font:inherit;font-size:20px;cursor:pointer;box-shadow:0 4px 0 rgba(63,167,232,.5)}
.chip.on{background:var(--yellow);box-shadow:0 4px 0 #d9ad1c}
.chip i{position:absolute;right:-2px;top:-8px;font-size:14px;font-style:normal}
.hint{text-align:center;font-size:clamp(14px,4vw,18px);margin:0;flex:0 0 auto}
.cards{display:grid;justify-content:center;align-content:start;align-items:start;gap:8px;margin-top:6px;flex:1 1 0;min-height:0;overflow:hidden}
.card{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;background:var(--card);border-radius:16px;padding:3px;box-shadow:0 6px 0 rgba(63,167,232,.45);animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.card svg{display:block;width:100%;height:auto;overflow:visible}
#tray.two{padding-left:max(8px,calc(50% - 150px));padding-right:max(8px,calc(50% - 150px))}
.card .rst{position:absolute;right:2px;top:2px;width:24px;height:24px;border:0;border-radius:50%;background:#e6f3fc;color:var(--ink);font-size:13px;padding:0;cursor:pointer}
.card.done{background:rgba(226,255,232,.92);box-shadow:0 6px 0 rgba(76,195,107,.6)}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.slot{cursor:pointer}
.slot .c.hot{stroke-width:9;fill:#fff7c8}
.pop{animation:pop .3s;transform-box:fill-box;transform-origin:center}
@keyframes pop{50%{transform:scale(1.18)}}
.prog{text-align:center;font-size:16px;margin:6px 0 0;flex:0 0 auto}
#tray{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;justify-content:center;flex-wrap:wrap;gap:6px 6px;
  padding:6px 8px calc(4px + env(safe-area-inset-bottom,0px));background:rgba(217,240,255,.93);border-top:4px solid #8fcdf2;border-radius:26px 26px 0 0}
#tray.show{display:flex}
.bal{position:relative;width:42px;height:54px;touch-action:none;cursor:grab;display:flex;align-items:flex-start;justify-content:center}
.bal .b{width:40px;height:45px;border-radius:50% 50% 48% 48%;display:flex;align-items:center;justify-content:center;
  font-size:21px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.2);box-shadow:inset -6px -6px 0 rgba(0,0,0,.12)}
.bal::after{content:"";position:absolute;left:50%;top:44px;width:3px;height:9px;background:#7aa3c0;transform:translateX(-50%)}
.bal.sel .b{outline:5px solid #fff;outline-offset:2px;transform:translateY(-6px)}
.bal.gone{visibility:hidden}
.bal.ghost{position:fixed;z-index:20;pointer-events:none;margin:-21px 0 0 -21px;transform:scale(1.35)}
.bal.ghost .b{box-shadow:0 10px 18px rgba(0,0,0,.25)}
.overlay{position:fixed;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(190,230,255,.7);padding:20px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:32px;padding:26px 22px;text-align:center;max-width:380px;width:100%;box-shadow:0 10px 0 rgba(63,167,232,.5);animation:in .4s}
.modal .em{font-size:64px;line-height:1}
.modal h2{margin:8px 0 16px;font-size:28px}
.modal .row{display:flex;flex-direction:column;gap:12px}
.conf{position:fixed;top:-20px;z-index:9;font-size:28px;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.card,.modal{animation:none}.conf{display:none}}
</style>
</head>
<body>

<svg id="bg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe5fb"/><stop offset="1" stop-color="#e8f7ff"/></linearGradient>
    <g id="tree"><rect x="-6" y="0" width="12" height="38" rx="3" fill="#a9754a"/><circle cx="0" cy="-8" r="30" fill="#5ec27a"/><circle cx="-18" cy="10" r="20" fill="#4fb36c"/><circle cx="18" cy="10" r="20" fill="#4fb36c"/></g>
    <g id="pine"><rect x="-5" y="20" width="10" height="26" fill="#a9754a"/><polygon points="0,-48 -28,0 28,0" fill="#4fae75"/><polygon points="0,-22 -34,28 34,28" fill="#5cc083"/></g>
    <g id="house"><rect x="-34" y="-30" width="68" height="52" fill="#fff4d6"/><polygon points="-42,-30 0,-66 42,-30" fill="#ff8a7a"/><rect x="-8" y="-4" width="16" height="26" rx="3" fill="#8bc7ee"/><rect x="-28" y="-22" width="14" height="14" fill="#bfe5fb"/><rect x="14" y="-22" width="14" height="14" fill="#bfe5fb"/></g>
    <g id="house2"><rect x="-30" y="-36" width="60" height="58" fill="#ffe0f0"/><polygon points="-38,-36 0,-70 38,-36" fill="#7a9cf0"/><rect x="-7" y="-2" width="14" height="24" rx="3" fill="#ffd84d"/><rect x="-22" y="-26" width="12" height="12" fill="#fff"/><rect x="10" y="-26" width="12" height="12" fill="#fff"/></g>
    <g id="cloud"><ellipse cx="0" cy="0" rx="46" ry="16" fill="#fff"/><circle cx="-14" cy="-10" r="18" fill="#fff"/><circle cx="12" cy="-14" r="22" fill="#fff"/></g>
  </defs>
  <rect width="800" height="600" fill="url(#sk)"/>
  <circle cx="690" cy="80" r="38" fill="#fff6b8"/>
  <use href="#cloud" x="120" y="90"/><use href="#cloud" x="400" y="70"/><use href="#cloud" x="620" y="170"/>
  <ellipse cx="200" cy="600" rx="420" ry="150" fill="#bfeacb"/>
  <ellipse cx="640" cy="610" rx="440" ry="140" fill="#a9e0b9"/>
  <use href="#pine" x="40" y="500"/><use href="#house" x="130" y="530"/><use href="#tree" x="215" y="520"/>
  <use href="#house2" x="330" y="545"/><use href="#pine" x="410" y="520"/><use href="#tree" x="490" y="525"/>
  <use href="#house" x="590" y="535"/><use href="#pine" x="680" y="505"/><use href="#house2" x="750" y="540"/>
</svg>

<div id="app">
  <div id="home">
    <div class="top"><span></span><button class="btn round" id="snd" aria-label="Звук">🔊</button></div>
    <h1>🏡 Состав числа</h1>
    <p class="sub">Выбери, с какими числами играть</p>
    <div class="home">
      <button class="range" id="r10"><b>Числа до 10</b><span>например: 7 — это 4 и 3</span></button>
      <button class="range y" id="r20"><b>Числа до 20</b><span>например: 14 — это 10 и 4</span></button>
      <button class="range g" id="r15"><b>Переход через десяток</b><span>например: 15 — это 8 и 7</span></button>
    </div>
  </div>

  <div id="play" hidden>
    <div class="top">
      <button class="btn round" id="back" aria-label="Назад">←</button>
      <div class="tabs">
        <button class="tab on" id="tTap">👆 Нажимай</button>
        <button class="tab" id="tDrag">🎈 Перетаскивай</button>
      </div>
      <button class="btn round" id="snd2" aria-label="Звук">🔊</button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="hint" id="hint"></div>
    <div class="cards" id="cards"></div>
    <div class="prog" id="prog"></div>
  </div>
</div>

<div id="tray"></div>

<div class="overlay" id="ov">
  <div class="modal">
    <div class="em">🎉</div>
    <h2>Молодец!</h2>
    <div class="row">
      <button class="btn green" id="nxt">Дальше</button>
      <button class="btn" id="again">Ещё раз</button>
      <button class="btn" id="tomenu" style="background:#8aa9c2;box-shadow:0 5px 0 #6a8aa4">В меню</button>
    </div>
  </div>
</div>

<script>
(function(){
  var stars={}, muted=false, ac=null;
  var range=10, mode='tap', n=7, cards=[], doneCount=0, selected=null, drag=null;

  /* ---------- Sound ---------- */
  function ctx(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==='suspended') ac.resume(); return ac; }
  function tone(f,t0,d,type,v){
    var a=ctx(); if(!a||muted) return;
    var o=a.createOscillator(), g=a.createGain(); o.type=type||'sine'; o.frequency.value=f;
    var s=a.currentTime+(t0||0);
    g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(v||0.25,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+d);
    o.connect(g); g.connect(a.destination); o.start(s); o.stop(s+d+0.05);
  }
  var scale=[523.25,587.33,659.25,698.46,783.99,880,987.77,1046.5,1174.7,1318.5];
  function sTap(k){ tone(scale[Math.min(k-1,scale.length-1)],0,0.18,'triangle',0.3); }
  function sOk(){ [523.25,659.25,783.99,1046.5].forEach(function(f,i){ tone(f,i*0.09,0.3,'triangle',0.28); }); }
  function sBad(){ tone(220,0,0.18,'sawtooth',0.15); tone(165,0.12,0.25,'sawtooth',0.15); }
  function sWin(){ [523.25,659.25,783.99,659.25,783.99,1046.5,1318.5].forEach(function(f,i){ tone(f,i*0.11,0.35,'square',0.12); tone(f*2,i*0.11,0.3,'sine',0.1); }); }
  function sClick(){ tone(440,0,0.08,'sine',0.2); }
  function sPick(){ tone(700,0,0.07,'sine',0.2); tone(900,0.05,0.07,'sine',0.15); }
  function setMute(m){ muted=m; $('snd').textContent=$('snd2').textContent=m?'🔇':'🔊'; }

  /* ---------- Helpers ---------- */
  function $(id){return document.getElementById(id)}
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;} return a; }
  var palette=[['#ffd84d','#d9ad1c'],['#ff9fb8','#d96b8a'],['#8fd5ff','#4aa6dd'],['#b7a6ff','#8670e0'],['#ffb37a','#e0803a'],['#8fe0a8','#4fb36c']];
  var balCols=['#ff6b6b','#3fa7e8','#4cc36b','#ff9f43','#a77be8','#f06ab0','#27b5a8'];
  function starPts(cx,cy,R,r){ var p=[]; for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));} return p.join(' '); }
  function hexPts(cx,cy,R){ var p=[]; for(var i=0;i<6;i++){var a=Math.PI/6+i*Math.PI/3;p.push((cx+R*Math.cos(a)).toFixed(1)+','+(cy+R*Math.sin(a)).toFixed(1));} return p.join(' '); }
  function shape(k,fill,stroke){
    var st='fill="'+fill+'" stroke="'+stroke+'" stroke-width="5" stroke-linejoin="round"';
    switch(k%4){
      case 0: return '<polygon points="55,44 100,6 145,44 145,86 55,86" '+st+'/>';
      case 1: return '<polygon points="'+starPts(100,46,52,29)+'" '+st+'/>';
      case 2: return '<polygon points="'+hexPts(100,46,48)+'" '+st+'/>';
      default: return '<rect x="52" y="8" width="96" height="76" rx="30" '+st+'/>';
    }
  }
  function skey(){ return mode+(range===10?'n'+n:range==='b'?'b'+n:'t'); }

  /* ---------- Navigation ---------- */
  function openRange(r){
    range=r; ctx(); sClick();
    if(r==='b' && (n<11||n>20)) n=15;
    if(r===10 && (n<2||n>10)) n=7;
    $('home').hidden=true; $('play').hidden=false;
    buildChips(); newRound();
  }
  function goHome(){ sClick(); $('ov').classList.remove('show'); $('play').hidden=true; $('home').hidden=false; $('tray').classList.remove('show'); window.scrollTo(0,0); }
  function buildChips(){
    var c=$('chips'); c.innerHTML='';
    if(range===20){ c.style.display='none'; return; }
    c.style.display='flex';
    for(var k=(range==='b'?11:2);k<=(range==='b'?20:10);k++){
      (function(k){
        var b=document.createElement('button'); b.className='chip'+(k===n?' on':''); b.textContent=k;
        if(stars[mode+(range==='b'?'b':'n')+k]){ var s=document.createElement('i'); s.textContent='⭐'; b.appendChild(s); }
        b.onclick=function(){ sClick(); n=k; buildChips(); newRound(); };
        c.appendChild(b);
      })(k);
    }
    var on=c.querySelector('.on'); if(on&&on.scrollIntoView) on.scrollIntoView({block:'nearest',inline:'center'});
  }
  function setMode(m){
    if(m===mode) return; mode=m; sClick();
    $('tTap').classList.toggle('on',m==='tap'); $('tDrag').classList.toggle('on',m==='drag');
    buildChips(); newRound();
  }

  /* ---------- Round ---------- */
  function newRound(){
    $('ov').classList.remove('show'); selected=null;
    var list;
    if(range===10){
      list=[]; for(var p=1;p<n;p++) list.push({top:n,known:p});
    } else if(range==='b'){
      list=[];
      var hi=n>=19?10:9;
      for(var q=n-hi;q<=hi;q++) list.push({top:n,known:q});
    } else {
      list=[]; for(var m=11;m<=20;m++) list.push({top:m,known:10});
    }
    cards=list.map(function(c,i){ c.need=c.top-c.known; c.left=true; c.count=0; c.done=false; c.k=i; c.col=palette[(Math.random()*palette.length)|0]; return c; });
    doneCount=0;
    $('hint').textContent = range===10 ? 'Число '+n+' — это …' : range==='b' ? 'Число '+n+' — это …' : 'От 11 до 20: 10 и …';
    $('hint').textContent += mode==='tap' ? '  Нажимай на пустой кружок' : '  Перетащи шарик в кружок';
    $('cards').className='cards'; render(); buildTray();
    window.scrollTo(0,0);
  }

  function render(){
    var box=$('cards'); box.innerHTML='';
    cards.forEach(function(c,i){
      var el=document.createElement('div'); el.className='card'; el.style.animationDelay=(i*70)+'ms';
      var kx=c.left?50:150, ex=c.left?150:50;
      el.innerHTML=
        '<svg viewBox="0 0 200 '+(c.a?232:205)+'" role="group">'+
        '<line x1="82" y1="84" x2="'+(kx+(c.left?6:-6))+'" y2="124" stroke="#6fb6e6" stroke-width="6" stroke-linecap="round"/>'+
        '<line x1="118" y1="84" x2="'+(ex+(c.left?-6:6))+'" y2="124" stroke="#6fb6e6" stroke-width="6" stroke-linecap="round"/>'+
        shape(c.k,c.col[0],c.col[1])+
        '<text x="100" y="62" text-anchor="middle" font-size="44" font-weight="900" fill="#1d4f7a">'+c.top+'</text>'+
        '<g><circle cx="'+kx+'" cy="158" r="36" fill="#fff" stroke="#3fa7e8" stroke-width="5"/>'+
        '<text x="'+kx+'" y="172" text-anchor="middle" font-size="42" font-weight="900" fill="#1d4f7a">'+c.known+'</text></g>'+
        '<g class="slot"><circle class="c" cx="'+ex+'" cy="158" r="38" fill="#fff3b0" stroke="#ff9f43" stroke-width="5" stroke-dasharray="9 7"/>'+
        '<text class="t" x="'+ex+'" y="172" text-anchor="middle" font-size="42" font-weight="900" fill="#c97a12">'+(mode==='tap'?'?':'')+'</text></g>'+
        (c.a?'<text class="cap" x="100" y="226" text-anchor="middle" font-size="30" font-weight="900" fill="#1d4f7a">'+c.a+' + '+c.top+'</text>':'')+
        '</svg>'+(mode==='tap'?'<button class="rst" aria-label="Сначала">↺</button>':'');
      c.el=el; c.slot=el.querySelector('.slot'); c.circ=el.querySelector('.c'); c.txt=el.querySelector('.t'); c.cap=el.querySelector('.cap');
      c.slot.addEventListener('pointerdown',function(e){
        e.preventDefault();
        if(mode==='tap') tap(c); else if(selected) place(c,selected);
      });
      var r=el.querySelector('.rst');
      if(r) r.onclick=function(){ if(c.done)return; c.count=0; c.txt.textContent='?'; sClick(); };
      box.appendChild(el);
    });
    prog(); fit();
  }
  function fit(){
    var box=$('cards'); if(!box||!cards.length||$('play').hidden) return;
    var W=box.clientWidth,H=box.clientHeight,N=cards.length,gx=8,gy=8,best=0,bc=1;
    for(var cols=Math.ceil(N/2);cols<=N;cols++){
      var rows=Math.ceil(N/cols);
      var w1=(W-(cols-1)*gx)/cols, w2=((H-(rows-1)*gy)/rows-8)/1.03, w=Math.min(w1,w2);
      if(w>best){best=w;bc=cols;}
    }
    var cw=Math.max(56,Math.min(best*0.94,210));
    box.style.gridTemplateColumns='repeat('+bc+','+cw+'px)';
  }
  window.addEventListener('resize',fit);
  if(window.ResizeObserver) new ResizeObserver(fit).observe($('cards'));
  function prog(){ $('prog').textContent='Готово: '+doneCount+' из '+cards.length; }

  function markDone(c,val,color){
    c.done=true; doneCount++;
    c.txt.textContent=val;
    if(c.cap) c.cap.textContent=c.a+' + '+c.top+' = '+(c.a+c.top);
    if(color){
      var ex=c.circ.getAttribute('cx');
      c.txt.insertAdjacentHTML('beforebegin',
        '<g class="pop"><line x1="'+ex+'" y1="187" x2="'+ex+'" y2="194" stroke="#7aa3c0" stroke-width="3"/>'+
        '<ellipse cx="'+ex+'" cy="158" rx="28" ry="31" fill="'+color+'"/>'+
        '<ellipse cx="'+(+ex-10)+'" cy="146" rx="6" ry="9" fill="#fff" opacity=".35"/></g>');
      c.txt.setAttribute('y',170); c.txt.setAttribute('font-size',34);
    }
    c.circ.setAttribute('fill','#8be3a3'); c.circ.setAttribute('stroke','#2f9a4c'); c.circ.removeAttribute('stroke-dasharray'); c.circ.classList.remove('hot');
    c.txt.setAttribute('fill',color?'#fff':'#1b6b36'); c.el.classList.add('done');
    c.txt.classList.remove('pop'); void c.txt.getBoundingClientRect(); c.txt.classList.add('pop');
    sOk(); prog(); sparkle(c.el);
    if(doneCount===cards.length) setTimeout(win,900);
  }
  function shake(c){ c.el.classList.remove('shake'); void c.el.offsetWidth; c.el.classList.add('shake'); }

  /* ---------- Tap mode ---------- */
  function tap(c){
    if(c.done) return; ctx();
    c.count++;
    if(c.count>c.need){ sBad(); c.count=0; c.txt.textContent='?'; shake(c); return; }
    c.txt.textContent=c.count; c.txt.classList.remove('pop'); void c.txt.getBoundingClientRect(); c.txt.classList.add('pop');
    if(c.count===c.need) markDone(c,c.need); else sTap(c.count);
  }

  /* ---------- Drag mode ---------- */
  function buildTray(){
    var t=$('tray'); t.innerHTML=''; selected=null;
    if(mode!=='drag'){ t.classList.remove('show'); $('app').style.paddingBottom='10px'; fit(); return; }
    var needs=cards.map(function(c){return c.need;});
    var max=range===10?n-1:range==='b'?9:10, pool=[];
    for(var v=1;v<=max;v++) if(needs.indexOf(v)<0) pool.push(v);
    var vals=shuffle(needs.concat(shuffle(pool).slice(0,2)));
    vals.forEach(function(v,i){
      var b=document.createElement('div'); b.className='bal'; b.dataset.v=v;
      b.innerHTML='<div class="b" style="background:'+balCols[(v+i)%balCols.length]+'">'+v+'</div>';
      b.addEventListener('pointerdown',function(e){ startDrag(e,b); });
      t.appendChild(b);
    });
    t.classList.add('show'); $('app').style.paddingBottom=(t.offsetHeight+6)+'px'; fit();
  }
  function slotAt(x,y){
    var best=null,bd=1e9;
    cards.forEach(function(c){
      if(c.done) return;
      var r=c.circ.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2, d=Math.hypot(x-cx,y-cy);
      if(d<Math.max(r.width*0.8,36) && d<bd){ bd=d; best=c; }
    });
    return best;
  }
  function startDrag(e,b){
    if(b.classList.contains('gone')) return;
    e.preventDefault(); ctx();
    drag={b:b,x0:e.clientX,y0:e.clientY,ghost:null,hot:null};
    window.addEventListener('pointermove',onMove);
    window.addEventListener('pointerup',onUp);
    window.addEventListener('pointercancel',onUp);
  }
  function onMove(e){
    if(!drag) return;
    if(!drag.ghost && Math.hypot(e.clientX-drag.x0,e.clientY-drag.y0)>8){
      var g=drag.b.cloneNode(true); g.classList.add('ghost'); g.classList.remove('sel'); document.body.appendChild(g);
      drag.ghost=g; sPick();
    }
    if(drag.ghost){
      drag.ghost.style.left=e.clientX+'px'; drag.ghost.style.top=(e.clientY-20)+'px';
      var c=slotAt(e.clientX,e.clientY-20);
      if(c!==drag.hot){ if(drag.hot) drag.hot.circ.classList.remove('hot'); if(c) c.circ.classList.add('hot'); drag.hot=c; }
    }
  }
  function onUp(e){
    window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); window.removeEventListener('pointercancel',onUp);
    if(!drag) return;
    var d=drag; drag=null;
    if(d.hot) d.hot.circ.classList.remove('hot');
    if(!d.ghost){ // tap on balloon: select it
      var was=d.b.classList.contains('sel');
      document.querySelectorAll('.bal.sel').forEach(function(x){x.classList.remove('sel');});
      if(was){ selected=null; } else { d.b.classList.add('sel'); selected=d.b; sPick(); }
      return;
    }
    d.ghost.remove(); d.b.classList.remove('gone');
    var c=slotAt(e.clientX,e.clientY-20);
    if(c) place(c,d.b);
  }
  function place(c,b){
    if(c.done) return;
    var v=+b.dataset.v;
    document.querySelectorAll('.bal.sel').forEach(function(x){x.classList.remove('sel');}); selected=null;
    if(v===c.need){ var col=b.querySelector('.b').style.background; markDone(c,v,col); }
    else { sBad(); shake(c); }
  }

  /* ---------- Effects & finish ---------- */
  function sparkle(el){
    var r=el.getBoundingClientRect();
    ['⭐','✨','🌟'].forEach(function(s,i){
      var d=document.createElement('div'); d.className='conf'; d.textContent=s;
      d.style.left=(r.left+r.width*(.25+i*.25))+'px'; d.style.top=(r.top+r.height/2)+'px'; d.style.animationDuration='1.2s';
      document.body.appendChild(d); setTimeout(function(){d.remove();},1300);
    });
  }
  function win(){
    stars[skey()]=true; sWin(); buildChips();
    for(var i=0;i<28;i++){
      var d=document.createElement('div'); d.className='conf'; d.textContent=['🎈','⭐','🎉','🌟','🍎'][i%5];
      d.style.left=(Math.random()*100)+'vw'; d.style.animationDuration=(2+Math.random()*2)+'s'; d.style.animationDelay=(Math.random()*.6)+'s';
      document.body.appendChild(d); (function(d){setTimeout(function(){d.remove();},4800);})(d);
    }
    $('nxt').style.display=((range===10&&n<10)||(range==='b'&&n<20))?'':'none';
    $('ov').classList.add('show');
  }

  $('r10').onclick=function(){ openRange(10); };
  $('r20').onclick=function(){ openRange(20); };
  $('r15').onclick=function(){ openRange('b'); };
  $('tTap').onclick=function(){ setMode('tap'); };
  $('tDrag').onclick=function(){ setMode('drag'); };
  $('nxt').onclick=function(){ sClick(); n++; buildChips(); newRound(); };
  $('again').onclick=function(){ sClick(); newRound(); };
  $('tomenu').onclick=goHome; $('back').onclick=goHome;
  $('snd').onclick=$('snd2').onclick=function(){ setMute(!muted); if(!muted) sClick(); };
})();
</script>
