<!DOCTYPE html>
<html lang="ru" data-theme="light"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Найди рисунок по дроби</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff8ec;--card:#fff;--ink:#4a2c14;--accent:#e8590c;--ok:#2f9e44;--bad:#e03131;--line:#8a4b1e;--soft:#b9a48f;--btn:#ffe8cc;--pe:#f1e6d6;--num:#d6336c;--den:#1c7ed6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1d12;--card:#3a281a;--ink:#fbe9d3;--accent:#ff922b;--ok:#69db7c;--bad:#ff8787;--line:#d9a066;--soft:#8d7a68;--btn:#53381f;--pe:#5a4330;--num:#ff8cc0;--den:#74c0fc}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Comic Sans MS","Trebuchet MS",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
main{width:100%;max-width:480px;padding:14px;flex:1}
h1{font-size:22px;text-align:center;margin:6px 0}
.bar{display:flex;justify-content:space-between;font-weight:bold;margin:6px 2px}
.prog{height:10px;background:var(--pe);border-radius:6px;overflow:hidden;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 2px 10px rgba(0,0,0,.1);text-align:center}
.tag{display:inline-block;background:var(--btn);border-radius:12px;padding:2px 10px;font-size:14px;margin-bottom:6px}
.q{font-size:19px;margin:4px 0 10px}.t{text-align:left;font-size:17px;line-height:1.4}
.pic{position:relative;width:120px;height:120px}.pic img,.pic svg{position:absolute;inset:0;width:100%;height:100%}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;justify-items:center}
.pick{border:3px solid var(--btn);border-radius:16px;padding:6px;background:none;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{font:inherit;font-size:20px;border:2px solid var(--line);background:var(--btn);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer}
button.main{background:var(--accent);color:#fff;border-color:var(--accent);margin-top:12px;width:100%}
.ok{background:var(--ok)!important;color:#fff;border-color:var(--ok)!important}.bad{background:var(--bad)!important;color:#fff;border-color:var(--bad)!important}
.pick.ok{background:none!important;border-color:var(--ok)!important}.pick.bad{background:none!important;border-color:var(--bad)!important}
.fr{display:inline-flex;flex-direction:column;align-items:center;line-height:1.1;vertical-align:middle;font-weight:bold}.fr b{padding:0 6px}.fr b:first-child{border-bottom:3px solid currentColor}
.fr.big b{font-size:40px;padding:0 12px}.n{color:var(--num)}.d{color:var(--den)}
.msg{min-height:28px;margin-top:10px;font-weight:bold}.bigi{font-size:60px}
.demo{display:flex;gap:14px;align-items:center;justify-content:center;margin:8px 0}
footer{padding:12px 14px 16px;font-size:11px;color:var(--soft);text-align:center;opacity:.8}footer a{color:inherit;text-decoration:underline}
.dots{display:flex;justify-content:center;gap:6px;margin:4px 0 8px}.dot{width:30px;height:30px;border-radius:50%;background:var(--pe);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:bold}
.dot.cur{background:var(--accent);color:#fff}.dot.done{background:var(--ok);color:#fff}
.stars{font-size:38px;margin:6px 0}.sm{font-size:15px;opacity:.85}
.pic svg path{cursor:pointer}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;justify-items:center}
.opts3{grid-template-columns:1fr 1fr 1fr}.mn{display:block;margin:0 auto 6px;font-size:15px;padding:6px 14px}.stb{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;font-size:17px;margin-top:8px}.stb small{font-size:14px;white-space:nowrap}
body{background-color:#fffef9;background-image:linear-gradient(rgba(66,135,225,.2) 1px,transparent 1px),linear-gradient(90deg,rgba(66,135,225,.2) 1px,transparent 1px);background-size:24px 24px;background-position:0 0}
body::before{content:'';position:fixed;top:0;bottom:0;left:26px;width:2px;background:rgba(224,49,49,.4);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:0;bottom:0;left:3px;width:18px;background:radial-gradient(circle at 9px 70px,#ece3d2 0 6px,#cbbfa8 7px,transparent 8px) 0 0/18px 150px repeat-y;pointer-events:none;z-index:0}
main{padding:14px 14px 14px 38px;position:relative;z-index:1}footer{position:relative;z-index:1}
h1{display:table;margin:8px auto 10px;padding:2px 14px;background:linear-gradient(transparent 58%,#ffe066 58%);transform:rotate(-1.5deg);font-size:23px}
.card{position:relative;margin-top:16px;border:2px dashed #e9b77a;box-shadow:3px 4px 0 rgba(233,183,122,.45)}
.card::before{content:'';position:absolute;top:-13px;left:50%;width:96px;height:24px;background:rgba(255,196,60,.65);transform:translateX(-50%) rotate(-3deg);border-radius:2px}
.dot{box-shadow:1px 2px 0 rgba(0,0,0,.12);transform:rotate(-4deg)}.dot:nth-child(even){transform:rotate(4deg)}
.tag{background:#fff3bf;transform:rotate(-1deg)}
.bar{font-size:15px}.prog{border:1.5px solid #e9b77a;background:#fff}
</style></head><body>

  c.innerHTML=`<span class="tag">${k0.tag} ${k0.name}</span>${h}<div class="msg" id="m"></div>`;
  if(st==2){const b=document.createElement('button');b.className='main';b.textContent='Проверить';c.appendChild(b);
    $('ipic').onclick=e=>{const p=e.target.closest('path');if(!p||done)return;const s=+p.dataset.s;if(Q.sel.has(s)){Q.sel.delete(s);p.setAttribute('fill-opacity','.02')}else{Q.sel.add(s);p.setAttribute('fill-opacity','.55')}};
    b.onclick=()=>{if(done)return;b.remove();fin(Q.sel.size==Q.k,`Нужно закрасить ${Q.k} из ${Q.n} частей`)};return}
  $('op').onclick=e=>{const b=e.target.closest('button');if(!b||done)return;let ok;
    if(st==0){ok=b.dataset.v==Q.n+'-'+Q.k;if(!ok)[...document.querySelectorAll('.pick')].find(x=>x.dataset.v==Q.n+'-'+Q.k).classList.add('ok');}
    else if(st==3)ok=b.dataset.v==Q.a.replace('>','&gt;').replace('<','&lt;')||b.textContent==Q.a;
    else ok=b.dataset.v==Q.n+'-'+Q.k;
    b.classList.add(ok?'ok':'bad');
    fin(ok,st==0?`Подсказка: внизу ${Q.n} — всего частей, сверху ${Q.k} — закрашено`:st==3?Q.hint:`Правильно: ${fr(Q.k,Q.n)}`)}
}
function fin(ok,hint){done=true;if(ok){sc++;tot++}$('sc').textContent=`⭐ ${tot}`;
  $('m').innerHTML=ok?`<span style="color:var(--ok)">Верно! 👏</span>`:`<span style="color:var(--bad)">Почти! ${hint}</span>`;
  const b=document.createElement('button');b.className='main';b.textContent=qi==4?'Закончить этап':'Дальше ➜';b.onclick=next;$('card').appendChild(b)}
function next(){qi++;if(qi<5)return show();cur=false;res[st]=sc;best[st]=Math.max(best[st]||0,sc);stageEnd()}
function stageEnd(){const s=sc==5?3:sc==4?2:sc>=2?1:0;dots();$('pr').style.width=((st+1)*5/25*100)+'%';
  const last=st==4;
  $('card').innerHTML=`<span class="tag">${STAGES[st].tag} Этап ${st+1} пройден</span><div class="stars">${'⭐'.repeat(s)}${'☆'.repeat(3-s)}</div><p class="q">Верно: ${sc} из 5</p><p class="sm">${s==3?'Отлично, без ошибок!':s==2?'Очень хорошо!':'Попробуй ещё раз пройти этот этап, чтобы стать лучше.'}</p><button class="main" id="nx">${last?'Итог 🏆':'Следующий этап ➜'}</button><button class="main" id="mm" style="background:var(--btn);color:var(--ink);border-color:var(--line)">☰ В меню</button>${s<2?'<button class="main" id="rt" style="background:var(--btn);color:var(--ink);border-color:var(--line)">Пройти этап заново</button>':''}`;
  $('nx').onclick=()=>{st++;if(st>4)return end();intro()};
  if($('rt'))$('rt').onclick=()=>intro();$('mm').onclick=menu}
function end(){st=5;dots();$('pr').style.width='100%';$('qn').textContent='Игра пройдена!';
  const m=tot>=22?['👨‍🍳','Шеф-повар дробей!']:tot>=15?['😊','Отличная работа!']:['🙂','Хорошее начало, попробуй ещё!'];
  $('card').innerHTML=`<div class="bigi">${m[0]}</div><p class="q">${m[1]}</p><p class="q">Твой результат: ${tot} из 25</p><button class="main" id="again">Играть снова</button>`;$('again').onclick=()=>{best=[];res=[];menu()}}
function menu(){cur=false;dots();$('qn').textContent='Выбери этап';$('sc').textContent=`⭐ ${tot}`;const dn=best.filter(x=>x!=null).length;$('pr').style.width=(dn/5*100)+'%';
  $('card').innerHTML=`<p class="q"><b>🍕 Меню этапов</b></p><p class="sm">Выбери любой этап. Звёзды показывают лучший результат.</p>${STAGES.map((s,x)=>{const b=best[x],n=b==null?0:b==5?3:b==4?2:b>=2?1:0;return `<button class="stb" data-x="${x}"><span>${s.tag} ${x+1}. ${s.name}</span><small>${b==null?'новый':'⭐'.repeat(n)+'☆'.repeat(3-n)+' '+b+'/5'}</small></button>`}).join('')}${dn==5?'<button class="main" id="fin">Показать итог 🏆</button>':''}`;
  document.querySelectorAll('.stb').forEach(b=>b.onclick=()=>{st=+b.dataset.x;intro()});if($('fin'))$('fin').onclick=end}
$('mn').onclick=menu;
menu();
</script></body></html>
